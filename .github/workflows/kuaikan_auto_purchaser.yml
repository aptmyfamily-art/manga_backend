name: KuaiKan Auto-Purchaser (Playwright Headless)

on:
  schedule:
    # รันตรวจสอบและปลดล็อคตอนอัตโนมัติทุก 4 ชั่วโมง
    - cron: '30 */4 * * *'
  workflow_dispatch:
    inputs:
      comic_id:
        description: 'Target Comic ID (e.g. 855785) - Leave empty to process all pending'
        required: false
        default: ''
      topic_id:
        description: 'Target Topic ID (optional)'
        required: false
        default: ''
      all_pending:
        description: 'Process all pending chapters from RawTracker'
        required: false
        type: boolean
        default: true
      max_chapters:
        description: 'Maximum chapters to process (0 = all)'
        required: false
        default: '0'
      cooldown_seconds:
        description: 'Cooldown seconds between chapter purchases (default: 300 = 5 minutes)'
        required: false
        default: '300'

concurrency:
  group: kuaikan-purchaser
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  kuaikan-playwright-purchase:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run KuaiKan Playwright Purchaser
        env:
          GAS_URL: ${{ secrets.GAS_URL || 'https://script.google.com/macros/s/AKfycbzG1H1eBoTsF7Omfso8v23N6HidWXU4kS-yyf0xDunb2BoZgPiUYPIOO2vMLSvYWwHsnw/exec' }}
          PASSCODE: ${{ secrets.PASSCODE || '10211032' }}
          KUAIKAN_COOKIE: ${{ secrets.KUAIKAN_COOKIE || '' }}
        run: |
          COMIC_ID="${{ github.event.inputs.comic_id }}"
          TOPIC_ID="${{ github.event.inputs.topic_id }}"
          MAX_CH="${{ github.event.inputs.max_chapters || '0' }}"
          COOLDOWN="${{ github.event.inputs.cooldown_seconds || '300' }}"
          ALL_PENDING="${{ github.event.inputs.all_pending || 'true' }}"

          if [ -n "$COMIC_ID" ]; then
            echo "🎯 Purchasing single chapter ComicID: $COMIC_ID"
            python tools/kuaikan_playwright_purchaser.py --comic-id "$COMIC_ID" --topic-id "$TOPIC_ID" --cooldown "$COOLDOWN"
          elif [ "$ALL_PENDING" = "true" ] || [ "${{ github.event_name }}" = "schedule" ]; then
            echo "📋 Scanning and purchasing all pending locked KuaiKan chapters..."
            python tools/kuaikan_playwright_purchaser.py --all-pending --max-chapters "$MAX_CH" --cooldown "$COOLDOWN"
          else
            echo "⚠️ No action specified."
          fi
