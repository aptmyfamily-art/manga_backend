<div id="updateQueueModal" class="modal">
    <div class="modal-content" style="max-width: 700px;">
        <h2 style="margin-bottom: 1.5rem;">แก้ไขรายละเอียดงาน</h2>
        <form id="updateQueueForm" onsubmit="handleUpdateQueueSubmit(event)">
            <input type="hidden" id="updateQueueId">
            <input type="hidden" id="updateMangaId">

            <div class="form-row" style="display: flex; gap: 1rem; margin-bottom: 1rem;">
                <div class="form-group" style="flex: 2;">
                    <label>มังงะ</label>
                    <input type="text" id="updateMangaName" readonly
                        style="background-color: #f1f5f9; cursor: not-allowed;">
                </div>
                <div class="form-group" style="flex: 1;">
                    <label>ตอนที่</label>
                    <input type="text" id="updateQueueChapter">
                </div>
                <div class="form-group" style="flex: 1;">
                    <label>ต้นทุนต่อตอน</label>
                    <input type="number" id="updateQueueCostPerChapter" value="0" step="0.01">
                </div>
            </div>

            <hr style="margin: 1rem 0; border: 0; border-top: 1px solid #e2e8f0;">

            <!-- Status & Assignee Fields -->
            <!-- Upload -->
            <div class="form-group" style="margin-bottom: 1rem;">
                <label>🔼 อัป Raw</label>
                <div style="display: flex; gap: 0.5rem; align-items: start;">
                    <select id="updateUploadStatus" style="flex: 1; min-width: 100px;">
                        <option value="รอเริ่ม">รอเริ่ม</option>
                        <option value="กำลังทำ">กำลังทำ</option>
                        <option value="เสร็จแล้ว">เสร็จแล้ว</option>
                    </select>
                    <div style="display: flex; flex-direction: column; gap: 0.5rem; flex: 2;">
                        <select id="updateUploaderName" style="width: 100%;">
                            <option value="">-- เลือกผู้รับผิดชอบ --</option>
                        </select>
                        <input type="text" id="updateRawLink" placeholder="ลิงก์ Raw" style="font-size: 0.85rem;">
                    </div>
                </div>
            </div>

            <!-- Extract -->
            <div class="form-group" style="margin-bottom: 1rem;">
                <label>📝 ดึงคำ</label>
                <div style="display: flex; gap: 0.5rem; align-items: start;">
                    <select id="updateExtractStatus" style="flex: 1; min-width: 100px;">
                        <option value="รอเริ่ม">รอเริ่ม</option>
                        <option value="กำลังทำ">กำลังทำ</option>
                        <option value="เสร็จแล้ว">เสร็จแล้ว</option>
                        <option value="Skipped">ข้าม (Skipped)</option>
                    </select>
                    <div style="display: flex; flex-direction: column; gap: 0.5rem; flex: 2;">
                        <select id="updateExtractorName" style="width: 100%;">
                            <option value="">-- เลือกผู้รับผิดชอบ --</option>
                        </select>
                        <input type="text" id="updateExtractLink" placeholder="ลิงก์ดึงคำ" style="font-size: 0.85rem;">
                    </div>
                </div>
            </div>

            <!-- Translate -->
            <div class="form-group" style="margin-bottom: 1rem;">
                <label>🌐 แปล</label>
                <div style="display: flex; gap: 0.5rem; align-items: start;">
                    <select id="updateTranslateStatus" style="flex: 1; min-width: 100px;">
                        <option value="รอเริ่ม">รอเริ่ม</option>
                        <option value="กำลังทำ">กำลังทำ</option>
                        <option value="เสร็จแล้ว">เสร็จแล้ว</option>
                    </select>
                    <select id="updateTranslatorName" style="flex: 2;">
                        <option value="">-- เลือกผู้รับผิดชอบ --</option>
                    </select>
                </div>
            </div>

            <!-- Typeset -->
            <div class="form-group" style="margin-bottom: 1rem;">
                <label>✍️ ลงคำ</label>
                <div style="display: flex; gap: 0.5rem; align-items: start;">
                    <select id="updateTypesetStatus" style="flex: 1; min-width: 100px;">
                        <option value="รอเริ่ม">รอเริ่ม</option>
                        <option value="กำลังทำ">กำลังทำ</option>
                        <option value="เสร็จแล้ว">เสร็จแล้ว</option>
                    </select>
                    <select id="updateTypesetterName" style="flex: 2;">
                        <option value="">-- เลือกผู้รับผิดชอบ --</option>
                    </select>
                </div>
            </div>

            <!-- Publish -->
            <div class="form-group" style="margin-bottom: 1rem;">
                <label>📤 เผยแพร่</label>
                <div style="display: flex; gap: 0.5rem; align-items: start;">
                    <select id="updatePublishStatus" style="flex: 1; min-width: 100px;">
                        <option value="รอเริ่ม">รอเริ่ม</option>
                        <option value="กำลังทำ">กำลังทำ</option>
                        <option value="เสร็จแล้ว">เสร็จแล้ว</option>
                    </select>
                    <select id="updatePublisherName" style="flex: 2;">
                        <option value="">-- เลือกผู้รับผิดชอบ --</option>
                    </select>
                </div>
            </div>

            <!-- Post -->
            <div class="form-group" style="margin-bottom: 1rem;">
                <label>✉️ โพสต์</label>
                <div style="display: flex; gap: 0.5rem; align-items: start;">
                    <select id="updatePostStatus" style="flex: 1; min-width: 100px;">
                        <option value="รอเริ่ม">รอเริ่ม</option>
                        <option value="กำลังทำ">กำลังทำ</option>
                        <option value="เสร็จแล้ว">เสร็จแล้ว</option>
                    </select>
                    <select id="updatePosterName" style="flex: 2;">
                        <option value="">-- เลือกผู้รับผิดชอบ --</option>
                    </select>
                </div>
            </div>

            <hr style="margin: 1rem 0; border: 0; border-top: 1px solid #e2e8f0;">

            <div class="form-group">
                <label>🔗 ลิงก์งานหลัก (Work Link)</label>
                <textarea id="updateWorkLink" rows="3" placeholder="https://..."></textarea>
            </div>

            <div class="form-group">
                <label>📌 หมายเหตุ</label>
                <textarea id="updateQueueNote" rows="2" placeholder="หมายเหตุเพิ่มเติม..."></textarea>
            </div>

            <div style="display: flex; gap: 1rem; margin-top: 1.5rem;">
                <button type="button" class="btn" style="background: #e2e8f0; flex: 1;"
                    onclick="document.getElementById('updateQueueModal').style.display='none'">ยกเลิก</button>
                <button type="submit" class="btn btn-primary" style="flex: 2;">บันทึกการแก้ไข</button>
            </div>
        </form>
    </div>
</div>
