<div id="stepModal" class="modal">
    <div class="modal-content" style="max-width: 500px;">
        <h2 id="stepModalTitle" style="margin-bottom: 1.5rem;">อัปเดตสถานะ</h2>
        <form id="stepForm" onsubmit="handleStepSubmit(event)">
            <input type="hidden" id="stepQueueId">
            <input type="hidden" id="stepName">

            <div class="form-group">
                <label>📊 สถานะ</label>
                <select id="stepStatus" required>
                    <option value="รอเริ่ม">⏸️ รอเริ่ม</option>
                    <option value="กำลังทำ">⚙️ กำลังทำ</option>
                    <option value="เสร็จแล้ว">✅ เสร็จแล้ว</option>
                </select>
            </div>

            <div class="form-group">
                <label>👤 ผู้รับผิดชอบ</label>
                <select id="stepAssignee">
                    <option value="">-- เลือกผู้รับผิดชอบ --</option>
                </select>
            </div>

            <div class="form-group">
                <label>🔗 ลิงก์งาน (ถ้ามี)</label>
                <input type="url" id="stepLink" placeholder="https://...">
                <small style="color: #64748b; font-size: 0.75rem;">ลิงก์จะแสดงในคอลัมน์ลิงก์/โน้ต</small>
            </div>

            <div class="form-group">
                <label>📝 หมายเหตุ (ถ้ามี)</label>
                <textarea id="stepNote" rows="2" placeholder="หมายเหตุเพิ่มเติม..."></textarea>
                <small style="color: #64748b; font-size: 0.75rem;">โน้ตจะแสดงในคอลัมน์ลิงก์/โน้ต</small>
            </div>

            <div style="display: flex; gap: 1rem; margin-top: 1.5rem;">
                <button type="button" class="btn" style="background: #e2e8f0; flex: 1;"
                    onclick="closeStepModal()">ยกเลิก</button>
                <button type="submit" class="btn btn-primary" style="flex: 2;">บันทึก</button>
            </div>
        </form>
    </div>
</div>
