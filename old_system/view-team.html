<div class="manga-settings-container">
    <header style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
        <div>
            <h2>จัดการทีมงาน</h2>
            <p style="color: #666;">เพิ่ม/แก้ไข รายชื่อสมาชิกในทีมสำหรับระบุตัวผู้ทำในคิวงาน</p>
        </div>
        <button class="btn btn-primary" onclick="openTeamModal()">+ เพิ่มสมาชิกใหม่</button>
    </header>

    <div class="card">
        <table style="width: 100%; border-collapse: collapse;">
            <thead>
                <tr style="background: #f8fafc; text-align: left;">
                    <th style="padding: 1rem; border-bottom: 1px solid #e2e8f0;">ชื่อสมาชิก</th>
                    <th style="padding: 1rem; border-bottom: 1px solid #e2e8f0;">ตำแหน่งหลัก</th>
                    <th style="padding: 1rem; border-bottom: 1px solid #e2e8f0;">สถานะ</th>
                    <th style="padding: 1rem; border-bottom: 1px solid #e2e8f0; text-align: center; width: 120px;">
                        จัดการ</th>
                </tr>
            </thead>
            <tbody id="teamTableBody">
                <!-- Data will be loaded here -->
            </tbody>
        </table>
    </div>
</div>

<!-- Team Member Modal -->
<div id="teamModal" class="modal">
    <div class="modal-content" style="max-width: 450px;">
        <h2 id="teamModalTitle" style="margin-bottom: 1.5rem;">เพิ่มสมาชิกทีม</h2>
        <form id="teamForm" onsubmit="handleTeamSubmit(event)">
            <input type="hidden" id="memberId">
            <div class="form-group">
                <label>ชื่อที่ใช้ในระบบ</label>
                <input type="text" id="memberName" placeholder="เช่น กขค" required>
            </div>
            <div class="form-group">
                <label>ตำแหน่งหลัก</label>
                <select id="memberRole">
                    <option value="Translator">Translator (คนแปล)</option>
                    <option value="Editor/Typesetter">Editor/Typesetter (คนลงคำ)</option>
                    <option value="Raw Provider/Uploader">Raw Provider/Uploader (คนหาภาพ/อัปโหลด)</option>
                    <option value="Cleaner/Draft">Extractor/Draft (คนดึงคำ)</option>
                    <option value="Multi-role">ทำได้ทุกอย่าง (Multi-role)</option>
                </select>
            </div>
            <div class="form-group">
                <label>สถานะ</label>
                <select id="memberStatus">
                    <option value="Active">กำลังทำงาน (Active)</option>
                    <option value="Inactive">พักงาน (Inactive)</option>
                </select>
            </div>
            <div style="display: flex; gap: 1rem; margin-top: 1.5rem;">
                <button type="button" class="btn" style="background: #e2e8f0; flex: 1;"
                    onclick="closeTeamModal()">ยกเลิก</button>
                <button type="submit" class="btn btn-primary" style="flex: 2;">บันทึกสมาชิก</button>
            </div>
        </form>
    </div>
</div>
