<style>
    :root {
        /* Modern Color Palette - Dark Theme */
        --primary-color: #6366f1;
        /* Indigo 500 */
        --primary-dark: #4f46e5;
        /* Indigo 600 */
        --primary-light: #818cf8;
        /* Indigo 400 */
        --secondary-color: #94a3b8;
        /* Slate 400 */

        --success-bg: rgba(34, 197, 94, 0.16);
        --success-text: #4ade80;
        --warning-bg: rgba(234, 179, 8, 0.16);
        --warning-text: #facc15;
        --danger-bg: rgba(239, 68, 68, 0.16);
        --danger-text: #f87171;
        --info-bg: rgba(99, 102, 241, 0.16);
        --info-text: #a5b4fc;

        /* Backgrounds & Surfaces (Dark Mode) */
        --bg-body: #0b0f19;
        /* Deep canvas */
        --bg-card: #151d2f;
        /* Surface card */
        --bg-card-hover: #1c273e;
        --bg-sidebar: #0d1322;
        /* Sidebar */
        --bg-input: #0b1120;
        /* Form inputs */
        --border-color: #26334d;
        /* Subtle border */
        --border-light: #1a2337;

        /* Typography */
        --text-main: #f1f5f9;
        /* Slate 100 */
        --text-muted: #94a3b8;
        /* Slate 400 */
        --text-subtle: #64748b;
        /* Slate 500 */

        /* Shadows & Radius */
        --shadow-sm: 0 1px 3px 0 rgba(0, 0, 0, 0.4);
        --shadow-md: 0 4px 12px -1px rgba(0, 0, 0, 0.5), 0 2px 4px -2px rgba(0, 0, 0, 0.4);
        --shadow-lg: 0 10px 20px -3px rgba(0, 0, 0, 0.6), 0 4px 6px -4px rgba(0, 0, 0, 0.5);
        --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.7), 0 8px 10px -6px rgba(0, 0, 0, 0.6);

        --radius-sm: 0.375rem;
        --radius-md: 0.5rem;
        --radius-lg: 1rem;
        --radius-xl: 1.5rem;

        --transition-fast: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        --transition-base: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Reset & Base */
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    body {
        font-family: 'Kanit', sans-serif;
        background-color: var(--bg-body);
        color: var(--text-main);
        color-scheme: dark;
        line-height: 1.5;
        overflow-x: hidden;
    }

    h1, h2, h3, h4, h5, h6 {
        color: var(--text-main);
    }

    p {
        color: var(--text-muted);
    }

    hr {
        border: 0;
        border-top: 1px solid var(--border-color);
    }

    /* --- LAYOUT STRUCTURE --- */
    .app-container {
        display: flex;
        min-height: 100vh;
        position: relative;
    }

    /* Sidebar */
    .sidebar {
        width: 280px;
        background: var(--bg-sidebar);
        color: var(--text-main);
        height: 100vh;
        position: fixed;
        left: 0;
        top: 0;
        z-index: 50;
        transition: transform 0.3s ease-in-out, left 0.3s ease-in-out;
        box-shadow: 4px 0 24px rgba(0, 0, 0, 0.35);
        border-right: 1px solid var(--border-color);
        overflow-y: auto;
        display: flex;
        flex-direction: column;
    }

    .logo {
        padding: 2rem;
        font-size: 1.5rem;
        font-weight: 700;
        display: flex;
        align-items: center;
        gap: 0.75rem;
        color: #f8fafc;
        border-bottom: 1px solid var(--border-color);
    }

    .nav-menu {
        list-style: none;
        padding: 1.5rem 1rem;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
    }

    .nav-item {
        padding: 0.875rem 1rem;
        border-radius: var(--radius-md);
        cursor: pointer;
        transition: var(--transition-base);
        color: var(--text-muted);
        font-weight: 500;
        display: flex;
        align-items: center;
        gap: 0.75rem;
    }

    .nav-item:hover {
        background: rgba(255, 255, 255, 0.06);
        color: #fff;
        transform: translateX(4px);
    }

    .nav-item.active {
        background: var(--primary-color);
        color: white;
        box-shadow: 0 4px 15px rgba(99, 102, 241, 0.45);
    }

    /* Main Content Area */
    .main-content {
        margin-left: 280px;
        width: calc(100% - 280px);
        padding: 2rem;
        padding-top: 5rem;
        transition: margin-left 0.3s ease-in-out, width 0.3s ease-in-out;
        min-height: 100vh;
    }

    /* Overlay for Mobile */
    .sidebar-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.7);
        z-index: 40;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.3s ease;
        backdrop-filter: blur(4px);
    }

    .sidebar-overlay.active {
        opacity: 1;
        pointer-events: auto;
    }

    /* Burger Button */
    .burger-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        position: fixed;
        top: 1rem;
        left: 1rem;
        z-index: 60;
        background: var(--bg-card);
        border: 1px solid var(--border-color);
        padding: 0.75rem;
        border-radius: var(--radius-md);
        box-shadow: var(--shadow-md);
        color: var(--text-main);
        cursor: pointer;
        transition: transform 0.2s, left 0.3s ease-in-out;
    }

    .burger-btn:active {
        transform: scale(0.95);
    }

    /* --- RESPONSIVE BREAKPOINTS --- */
    @media (max-width: 1024px) {
        .sidebar {
            transform: translateX(-100%);
        }

        .main-content {
            margin-left: 0;
            width: 100%;
        }

        /* Mobile Active State */
        body.mobile-open .sidebar {
            transform: translateX(0);
        }
    }

    /* --- COMPONENTS & UI ELEMENTS --- */

    /* Buttons */
    .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        padding: 0.625rem 1.25rem;
        font-weight: 500;
        border-radius: var(--radius-md);
        transition: var(--transition-base);
        border: none;
        cursor: pointer;
        font-size: 0.95rem;
        font-family: inherit;
    }

    .btn:active {
        transform: translateY(1px);
    }

    .btn-primary {
        background: var(--primary-color);
        color: white;
        box-shadow: 0 4px 10px rgba(99, 102, 241, 0.35);
    }

    .btn-primary:hover {
        background: var(--primary-dark);
        box-shadow: 0 6px 14px rgba(99, 102, 241, 0.45);
        transform: translateY(-2px);
    }

    .btn-secondary {
        background: #1e293b;
        color: var(--text-main);
        border: 1px solid var(--border-color);
    }

    .btn-secondary:hover {
        background: #27354f;
        color: #fff;
    }

    /* Cards */
    .card {
        background: var(--bg-card);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-sm);
        border: 1px solid var(--border-color);
        transition: var(--transition-base);
        overflow: hidden;
    }

    .card:hover {
        box-shadow: var(--shadow-lg);
        border-color: #384b70;
    }

    .dashboard-card {
        background: var(--bg-card);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-sm);
        border: 1px solid var(--border-color);
        padding: 1.5rem;
        transition: var(--transition-base);
    }

    .dashboard-card:hover {
        box-shadow: var(--shadow-lg);
        border-color: #384b70;
    }

    .card-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 1.25rem;
    }

    .card-title {
        font-size: 1.1rem;
        font-weight: 600;
        color: var(--text-main);
    }

    .trend-pill {
        display: inline-block;
        padding: 0.2rem 0.6rem;
        border-radius: 9999px;
        font-size: 0.7rem;
        font-weight: 600;
    }

    .trend-up {
        background: rgba(34, 197, 94, 0.16);
        color: #4ade80;
        border: 1px solid rgba(34, 197, 94, 0.3);
    }

    .trend-down {
        background: rgba(239, 68, 68, 0.16);
        color: #f87171;
        border: 1px solid rgba(239, 68, 68, 0.3);
    }

    .stat-card {
        background: var(--bg-card);
        padding: 1.5rem;
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-sm);
        display: flex;
        justify-content: space-between;
        align-items: center;
        transition: var(--transition-base);
        border: 1px solid var(--border-color);
        position: relative;
        overflow: hidden;
    }

    .stat-card .stat-info h3 {
        font-size: 0.85rem;
        color: var(--text-muted);
        font-weight: 500;
    }

    .stat-card .stat-info p {
        font-size: 1.5rem;
        color: var(--text-main);
        font-weight: 700;
    }

    .stat-card::after {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(45deg, transparent 40%, rgba(255, 255, 255, 0.05) 50%, transparent 60%);
        transform: translateX(-100%);
        transition: 0.5s;
    }

    .stat-card:hover::after {
        transform: translateX(100%);
    }

    .stat-card:hover {
        transform: translateY(-4px);
        box-shadow: var(--shadow-lg);
        border-color: #384b70;
    }

    .stat-icon {
        width: 44px;
        height: 44px;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.25rem;
    }

    /* Stats Grid */
    .stats-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 1.5rem;
    }

    @media (max-width: 640px) {
        .stats-grid {
            grid-template-columns: 1fr;
        }
    }

    /* Inputs & Form Elements */
    input,
    select,
    textarea,
    .filter-select {
        width: 100%;
        padding: 0.75rem 1rem;
        border: 1px solid var(--border-color);
        border-radius: var(--radius-md);
        background: var(--bg-input);
        color: var(--text-main);
        transition: var(--transition-fast);
        outline: none;
        font-size: 0.95rem;
        font-family: inherit;
    }

    input:focus,
    select:focus,
    textarea:focus,
    .filter-select:focus {
        border-color: var(--primary-color) !important;
        background: #0f1626 !important;
        box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25) !important;
    }

    input::placeholder,
    textarea::placeholder {
        color: #475569;
    }

    option {
        background: #151d2f;
        color: #f1f5f9;
    }

    label {
        display: inline-block;
        margin-bottom: 0.4rem;
        color: var(--text-muted);
        font-weight: 500;
        font-size: 0.875rem;
    }

    .form-group {
        margin-bottom: 1rem;
    }

    /* --- RESPONSIVE TABLES --- */
    table {
        width: 100%;
        border-collapse: collapse;
    }

    th {
        background: #0f1626 !important;
        font-weight: 600;
        color: var(--text-muted) !important;
        text-transform: uppercase;
        font-size: 0.75rem;
        letter-spacing: 0.05em;
        padding: 1rem;
        text-align: left;
        border-bottom: 1px solid var(--border-color) !important;
    }

    td {
        padding: 0.75rem 1rem;
        border-bottom: 1px solid var(--border-color) !important;
        color: #cbd5e1 !important;
        vertical-align: top;
    }

    tbody tr:hover {
        background: rgba(255, 255, 255, 0.02) !important;
    }

    /* Mobile Table: Card View */
    @media (max-width: 768px) {
        table,
        thead,
        tbody,
        th,
        td,
        tr {
            display: block;
        }

        thead tr {
            position: absolute;
            top: -9999px;
            left: -9999px;
        }

        tr {
            background: var(--bg-card) !important;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-sm);
            margin-bottom: 1rem;
            border: 1px solid var(--border-color) !important;
            overflow: hidden;
        }

        td {
            border: none;
            border-bottom: 1px solid var(--border-color) !important;
            position: relative;
            padding-left: 40% !important;
            min-height: 3rem;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            text-align: right;
        }

        td:last-child {
            border-bottom: none !important;
        }

        td::before {
            position: absolute;
            top: 50%;
            left: 1rem;
            transform: translateY(-50%);
            width: 35%;
            white-space: nowrap;
            font-weight: 600;
            color: var(--text-muted) !important;
            text-align: left;
            content: attr(data-label);
        }

        #queueTableBody td:nth-of-type(1)::before {
            content: "เลือก";
        }

        #queueTableBody td:nth-of-type(1) {
            justify-content: flex-start;
            padding-left: 1rem !important;
        }

        #queueTableBody td:nth-of-type(1)::before {
            display: inline-block;
            position: static;
            margin-right: 0.5rem;
            transform: none;
            width: auto;
        }

        #queueTableBody td:nth-of-type(2)::before {
            content: "วันที่/เรื่อง";
        }

        #queueTableBody td:nth-of-type(3)::before {
            content: "อัป Raw";
        }

        #queueTableBody td:nth-of-type(4)::before {
            content: "ดึงคำ";
        }

        #queueTableBody td:nth-of-type(5)::before {
            content: "แปล";
        }

        #queueTableBody td:nth-of-type(6)::before {
            content: "ลงคำ";
        }

        #queueTableBody td:nth-of-type(7)::before {
            content: "Publisher";
        }

        #queueTableBody td:nth-of-type(8)::before {
            content: "โพสต์";
        }

        #queueTableBody td:nth-of-type(9)::before {
            content: "โน้ต";
        }

        #queueTableBody td:nth-of-type(9) {
            display: block;
            padding-left: 1rem !important;
            text-align: left;
        }

        #queueTableBody td:nth-of-type(9)::before {
            position: static;
            display: block;
            margin-bottom: 0.5rem;
            transform: none;
        }

        #queueTableBody td:nth-of-type(10)::before {
            content: "จัดการ";
        }
    }

    /* Selected Row Highlight */
    tr.selected-row {
        background-color: rgba(99, 102, 241, 0.15) !important;
    }

    /* Badges */
    .status-badge {
        display: inline-flex;
        align-items: center;
        padding: 0.25rem 0.5rem;
        border-radius: 4px;
        font-size: 0.65rem;
        font-weight: 500;
        line-height: 1;
        transition: opacity 0.2s;
        white-space: nowrap;
        border: 1px solid transparent;
    }

    .status-badge:hover {
        opacity: 0.85;
    }

    /* Modals */
    .modal {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(3, 7, 18, 0.75);
        backdrop-filter: blur(8px);
        z-index: 100;
        padding: 1rem;
        align-items: center;
        justify-content: center;
        opacity: 0;
        transition: opacity 0.3s;
    }

    .modal[style*="display: flex"] {
        opacity: 1;
    }

    .modal-content {
        background: var(--bg-card);
        color: var(--text-main);
        border: 1px solid var(--border-color);
        border-radius: var(--radius-xl);
        width: 100%;
        max-width: 550px;
        max-height: 90vh;
        overflow-y: auto;
        padding: 2rem;
        box-shadow: var(--shadow-xl);
        transform: scale(0.95);
        transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .modal[style*="display: flex"] .modal-content {
        transform: scale(1);
    }

    .modal-header {
        background: #0f1626 !important;
        border-bottom: 1px solid var(--border-color) !important;
    }

    .modal-header h2, .modal-header h3 {
        color: var(--text-main) !important;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
    }

    ::-webkit-scrollbar-track {
        background: #0b0f19;
    }

    ::-webkit-scrollbar-thumb {
        background: #26334d;
        border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
        background: #3b4e73;
    }

    /* Utilities */
    .hidden {
        display: none !important;
    }

    @keyframes fadeIn {
        from {
            opacity: 0;
            transform: translateY(10px);
        }

        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    /* --- CALENDAR & DASHBOARD --- */
    .dashboard-container {
        display: flex;
        flex-direction: column;
        gap: 2rem;
        width: 100%;
    }

    .dashboard-grid {
        display: grid;
        grid-template-columns: 3fr 1fr;
        gap: 1.5rem;
        align-items: start;
    }

    @media (max-width: 1024px) {
        .dashboard-grid {
            grid-template-columns: 1fr;
        }

        .pending-panel {
            order: -1;
        }
    }

    .panel-card {
        background: var(--bg-card);
        border-radius: var(--radius-lg);
        padding: 1.5rem;
        box-shadow: var(--shadow-sm);
        border: 1px solid var(--border-color);
    }

    .panel-title {
        font-size: 1.1rem;
        font-weight: 600;
        color: var(--text-main);
        margin-bottom: 1.25rem;
        display: flex;
        align-items: center;
        gap: 0.5rem;
    }

    .panel-title button {
        border-color: var(--border-color) !important;
        color: var(--text-muted) !important;
        background: transparent !important;
        border-radius: 4px;
        transition: all 0.2s;
    }

    .panel-title button:hover {
        background: var(--border-color) !important;
        color: var(--text-main) !important;
    }

    .calendar-grid {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: 1px;
        background: var(--border-color);
        border: 1px solid var(--border-color);
        border-radius: var(--radius-md);
        overflow: hidden;
    }

    .calendar-header {
        background: #0f1626;
        padding: 0.75rem;
        font-weight: 600;
        text-align: center;
        color: var(--text-muted);
        font-size: 0.85rem;
    }

    .calendar-day {
        background: var(--bg-card);
        padding: 0.5rem;
        min-height: 120px;
        display: flex;
        flex-direction: column;
        gap: 0.25rem;
    }

    .calendar-day.today {
        background: #17213b;
        box-shadow: inset 0 0 0 1px var(--primary-color);
    }

    .calendar-day.other-month {
        background: #0b0f19;
        color: #475569;
    }

    .day-number {
        font-size: 0.8rem;
        font-weight: 600;
        color: var(--text-muted);
        margin-bottom: 0.25rem;
        display: flex;
        justify-content: space-between;
    }

    .calendar-item {
        font-size: 0.65rem;
        padding: 3px 5px;
        border-radius: 3px;
        background: #1e293b;
        color: var(--text-main);
        border-left: 2px solid #475569;
        cursor: pointer;
        transition: var(--transition-base);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .calendar-item:hover {
        transform: translateY(-1px);
        box-shadow: var(--shadow-sm);
        background: #27354f;
        z-index: 10;
        position: relative;
    }

    .calendar-item.scheduled {
        border-left-color: #64748b;
    }

    .calendar-item.in-queue {
        background: rgba(234, 179, 8, 0.16);
        border-left-color: #eab308;
        color: #fef08a;
    }

    /* รอแปล - ด่วน (สีแดงชัดๆ) */
    .calendar-item.item-translate-urgent {
        background: rgba(239, 68, 68, 0.28) !important;
        border: 1px solid rgba(248, 113, 113, 0.45) !important;
        border-left: 4px solid #ef4444 !important;
        color: #fca5a5 !important;
        font-weight: 600 !important;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
    }
    .calendar-item.item-translate-urgent:hover {
        background: rgba(239, 68, 68, 0.45) !important;
        border-color: #f87171 !important;
        color: #ffffff !important;
        box-shadow: 0 0 8px rgba(239, 68, 68, 0.4);
    }

    /* รอแปล - ปกติ (สีเหลืองชัดๆ) */
    .calendar-item.item-translate {
        background: rgba(234, 179, 8, 0.25) !important;
        border: 1px solid rgba(250, 204, 21, 0.45) !important;
        border-left: 4px solid #eab308 !important;
        color: #fde047 !important;
        font-weight: 600 !important;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
    }
    .calendar-item.item-translate:hover {
        background: rgba(234, 179, 8, 0.42) !important;
        border-color: #facc15 !important;
        color: #ffffff !important;
        box-shadow: 0 0 8px rgba(234, 179, 8, 0.4);
    }

    /* รอลงคำ และ งานลงคำ (สีเขียวชัดๆ) */
    .calendar-item.item-typeset-waiting,
    .calendar-item.item-typeset-doing {
        background: rgba(34, 197, 94, 0.28) !important;
        border: 1px solid rgba(74, 222, 128, 0.45) !important;
        border-left: 4px solid #22c55e !important;
        color: #4ade80 !important;
        font-weight: 600 !important;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
    }
    .calendar-item.item-typeset-waiting:hover,
    .calendar-item.item-typeset-doing:hover {
        background: rgba(34, 197, 94, 0.45) !important;
        border-color: #4ade80 !important;
        color: #ffffff !important;
        box-shadow: 0 0 8px rgba(34, 197, 94, 0.4);
    }

    /* รอดึงคำ (ถ้ามี) */
    .calendar-item.item-extract {
        background: rgba(148, 163, 184, 0.15);
        border-left-color: #64748b;
        color: #cbd5e1;
    }
    .calendar-item.item-extract:hover {
