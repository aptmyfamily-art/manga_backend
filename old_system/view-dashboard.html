<header>
    <h1>หน้าแรก</h1>
    <p style="color: #64748b; font-size: 0.9rem;">ภาพรวมระบบและการปล่อยมังงะ (Smart Dashboard)</p>
</header>

<div class="dashboard-container">
    <!-- Stats Row -->
    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-info">
                <h3>มังงะทั้งหมด</h3>
                <p id="totalSeries">0</p>
            </div>
            <div class="stat-icon" style="background: #e0e7ff; color: #4f46e5;">📚</div>
        </div>
        <div class="stat-card" style="cursor: pointer;" onclick="switchView('queue')">
            <div class="stat-info">
                <h3>คิวงานที่ค้างอยู่</h3>
                <p id="pendingSeries">0</p>
            </div>
            <div class="stat-icon" style="background: #fef9c3; color: #854d0e;">⏳</div>
        </div>
        <div class="stat-card">
            <div class="stat-info">
                <h3>เสร็จแล้วในสัปดาห์นี้</h3>
                <p id="finishedThisWeek">0</p>
            </div>
            <div class="stat-icon" style="background: #dcfce7; color: #16a34a;">✅</div>
        </div>
        <div class="stat-card">
            <div class="stat-info">
                <h3>ควรปล่อยวันนี้</h3>
                <p id="releasedToday">0</p>
            </div>
            <div class="stat-icon" style="background: #fee2e2; color: #dc2626;">🔥</div>
        </div>
    </div>

    <!-- Main Grid -->
    <div class="dashboard-grid">
        <!-- Left: Monthly Release Schedule -->
        <div class="panel-card calendar-panel">
            <div class="panel-title" style="justify-content: space-between;">
                <div style="display: flex; align-items: center; gap: 0.5rem;">
                    <span>📅</span> ตารางงานประจำเดือน (Monthly Overview)
                </div>
                <!-- Manual Refresh Button -->
                <button onclick="manualRefresh()"
                    style="background: none; border: 1px solid #cbd5e1; border-radius: 4px; padding: 2px 8px; cursor: pointer; color: #64748b; font-size: 0.85rem; display: flex; align-items: center; gap: 4px;">
                    🔄 Refresh
                </button>
                <!-- Month Controls can go here if needed later -->
                <div id="calendarMonthLabel" style="font-size: 0.9rem; color: #64748b;"></div>
            </div>

            <!-- Color Guide / คำอธิบายสีตามสถานะ -->
            <div style="display: flex; flex-wrap: wrap; gap: 0.75rem; font-size: 0.75rem; margin-bottom: 0.75rem; padding: 0.4rem 0.6rem; background: rgba(255, 255, 255, 0.02); border-radius: var(--radius-sm); border: 1px solid var(--border-light); align-items: center;">
                <span style="display: flex; align-items: center; gap: 5px;">
                    <span style="width: 12px; height: 12px; border-radius: 2px; background: rgba(239, 68, 68, 0.25); border-left: 3px solid #ef4444; display: inline-block;"></span>
                    <span style="color: #fca5a5; font-weight: 500;">🔥 รอแปล (ด่วน)</span>
                </span>
                <span style="display: flex; align-items: center; gap: 5px;">
                    <span style="width: 12px; height: 12px; border-radius: 2px; background: rgba(234, 179, 8, 0.25); border-left: 3px solid #eab308; display: inline-block;"></span>
                    <span style="color: #fef08a;">รอแปล (ปกติ)</span>
                </span>
                <span style="display: flex; align-items: center; gap: 5px;">
                    <span style="width: 12px; height: 12px; border-radius: 2px; background: rgba(34, 197, 94, 0.35); border-left: 3px solid #22c55e; display: inline-block;"></span>
                    <span style="color: #4ade80; font-weight: 500;">รอลงคำ / ลงคำ</span>
                </span>
            </div>

            <div id="monthlySchedule" class="calendar-grid">
                <!-- Calendar will be loaded here -->
                <p style="text-align: center; color: #94a3b8; padding: 2rem;">กำลังโหลดตารางงาน...</p>
            </div>
        </div>

        <!-- Right: This Week's Progress (Pending Works) -->
        <div class="panel-card pending-panel">
            <div class="panel-title">
                <span>📋</span> งานที่รอดำเนินการ (Pending)
            </div>
            <div id="pendingWorksList" class="pending-list">
                <!-- Pending tasks will be loaded here -->
                <p style="text-align: center; color: #94a3b8; padding: 1rem;">ไม่มีงานค้าง</p>
            </div>
        </div>
    </div>
</div>
