            'กำลังทำ': { bg: 'rgba(234, 179, 8, 0.18)', text: '#facc15' },
            'รอเริ่ม': { bg: '#1e293b', text: '#94a3b8' },
            'Skipped': { bg: '#151d2f', text: '#64748b' }
        };
        const style = colors[status] || colors['รอเริ่ม'];
        const statusText = status === 'Skipped' ? 'ข้าม' : (status || 'รอเริ่ม');

        // Always call openStepModal - it will handle lock checking with expiration
        const onclickAction = status === 'Skipped' ? '' : `openStepModal('${id}', '${step}', '${status}')`;

        return `<span class="status-badge"
        style="background: ${style.bg}; color: ${style.text}; ${status === 'Skipped' ? 'opacity: 0.5; cursor: not-allowed;' : ''}"
        onclick="${onclickAction}">
            ${statusText}
        </span>`;
    }

    function openStepModal(id, step, currentStatus) {
        // Team data is already loaded on initial page load
        proceedOpenStepModal(id, step, currentStatus);
    }

    function proceedOpenStepModal(id, step, currentStatus) {
        // Store current queue item and step info
        document.getElementById('stepQueueId').value = id;
        document.getElementById('stepName').value = step;
        document.getElementById('stepStatus').value = currentStatus || 'รอเริ่ม';

        // Clear previous values
        document.getElementById('stepLink').value = '';
        document.getElementById('stepNote').value = '';

        // Set modal title and define allowed roles
        const stepLabels = {
            'upload': '🔼 อัปโหลด Raw',
            'extract': '📝 ดึงคำ (Extractor)',
            'translate': '🌐 แปล (Translator)',
            'typeset': '✍️ ลงคำ (Typesetter)',
            'publish': '📤 เผยแพร่ (Publisher)',
            'post': '📮 โพสต์ (Post)'
        };
        document.getElementById('stepModalTitle').innerText = 'อัปเดต: ' + (stepLabels[step] || step);

        // Define allowed roles for each step
        const roleMapping = {
            'upload': ['Raw Provider/Uploader', 'Multi-role'],
            'extract': ['Cleaner/Draft', 'Multi-role'],
            'translate': ['Translator', 'Multi-role'],
            'typeset': ['Editor/Typesetter', 'Multi-role'],
            'publish': ['Raw Provider/Uploader', 'Multi-role'],
            'post': ['Poster', 'Multi-role']
        };
        const allowedRoles = roleMapping[step] || [];

        // Populate assignee dropdown with filter
        populateStepAssignee(teamList, allowedRoles);

        // Get current assignee from queue data
        const queue = queueList.find(q => q.queueid.toString() === id.toString());
        if (queue) {
            // Map step to correct data property
            const assigneeFields = {
                'upload': 'uploadername',
                'extract': 'extractorname',
                'translate': 'translatorname',
                'typeset': 'typesettername',
                'publish': 'publishername',
                'post': 'postername'
            };
            const assigneeField = assigneeFields[step] || (step.toLowerCase() + 'name');
            const currentAssignee = queue[assigneeField] || '';

            // Set the value (populateStepAssignee has just run, so options exist)
            document.getElementById('stepAssignee').value = currentAssignee;
        }

        document.getElementById('stepModal').style.display = 'flex';
    }

    function closeStepModal() {
        document.getElementById('stepModal').style.display = 'none';
    }

    function populateStepAssignee(team, allowedRoles) {
        const select = document.getElementById('stepAssignee');
        if (!select) return;
        const currentVal = select.value;
        select.innerHTML = '<option value="">-- เลือกผู้รับผิดชอบ --</option>';

        team.forEach(m => {
            // Filter by allowed roles if provided, otherwise show all
            if (!allowedRoles || allowedRoles.length === 0 || allowedRoles.includes(m.role)) {
                const opt = document.createElement('option');
                opt.value = m.name;
                opt.textContent = m.name + (m.role ? ` (${m.role})` : '');
                select.appendChild(opt);
            }
        });

        // Preserve current value if it exists in the new options, or allows showing current assignee even if role changed
        if (currentVal) {
            // Check if the current value is already added, if not (e.g. role changed but still assigned), maybe add it? 
            // For now, standard behavior: try to set value.
            select.value = currentVal;
        }
    }

    function handleStepSubmit(e) {
        e.preventDefault();
        const btn = e.target.querySelector('button[type="submit"]');
        const originalText = btn.innerText;

        const queueId = document.getElementById('stepQueueId').value;
        const step = document.getElementById('stepName').value;
        const status = document.getElementById('stepStatus').value;
        const assignee = document.getElementById('stepAssignee').value;
        const link = document.getElementById('stepLink').value;
        const note = document.getElementById('stepNote').value;

        // === OPTIMISTIC UI UPDATE ===
        // 1. Save current state for rollback
        const queueItem = queueList.find(q => q.queueid.toString() === queueId.toString());
        if (!queueItem) {
            Swal.fire('Error', 'Queue item not found', 'error');
            return;
        }

        const backup = JSON.parse(JSON.stringify(queueItem)); // Deep copy

        // 2. Update local data immediately
        const statusField = step.toLowerCase() + 'status';
        const nameField = {
            'upload': 'uploadername',
            'extract': 'extractorname',
            'translate': 'translatorname',
            'typeset': 'typesettername',
            'publish': 'publishername',
            'post': 'postername'
        }[step.toLowerCase()];
        const timeField = step.toLowerCase() + 'time';

        queueItem[statusField] = status;
        if (nameField && assignee !== undefined) {
            queueItem[nameField] = assignee;
        }
        if (status === 'เสร็จแล้ว') {
            queueItem[timeField] = new Date().toISOString();
        }
        // If publish is marked as 'เสร็จแล้ว', ensure poststatus is initialized to 'รอเริ่ม' if empty
        if (step.toLowerCase() === 'publish' && status === 'เสร็จแล้ว') {
            if (!queueItem.poststatus || String(queueItem.poststatus).trim() === '') {
                queueItem.poststatus = 'รอเริ่ม';
            }
        }

        // 3. Update UI immediately (Optimistic)
        closeStepModal();
        filterQueue();
        showToast('กำลังบันทึก...');

        // 4. Send to backend in background
        google.script.run
            .withSuccessHandler(response => {
                if (response.error) {
                    // Rollback on error
                    console.error('Backend error:', response.error);
                    const index = queueList.findIndex(q => q.queueid.toString() === queueId.toString());
                    if (index !== -1) {
                        queueList[index] = backup;
                        filterQueue();
                    }
                    Swal.fire('Error', response.error, 'error');
                } else {
                    // Success - update with server data
                    queueList = response.queue;
                    filterQueue();
                    showToast('✅ บันทึกสำเร็จ');
                }
            })
            .withFailureHandler(err => {
                // Rollback on failure
                console.error('Backend failure:', err);
                const index = queueList.findIndex(q => q.queueid.toString() === queueId.toString());
                if (index !== -1) {
                    queueList[index] = backup;
                    filterQueue();
                }
                Swal.fire('Error', 'การบันทึกล้มเหลว: ' + err.message, 'error');
            })
            .updateQueueStep(queueId, step, status, assignee, link, note);
    }

    function getStepLink(worklink, stepLabel) {
        if (!worklink) return '';

        const links = String(worklink).split('\n').filter(l => l.trim());
        let html = '';

        links.forEach(linkStr => {
            // Check if link starts with [StepLabel]
            const match = linkStr.match(/^\[(.*?)\]\s*(.*)$/);

            if (match) {
                // Labeled link
                const label = match[1];
                const url = match[2];

                if (label === stepLabel) {
                    html += `<a href="${url}" target="_blank" class="step-link" title="${label}">🔗 Link</a>`;
                }
            } else {
                // Legacy link (no label) - show in 'Upload Raw' or 'Work Link' if you want. 
                // However, user asked to show "Link of each page". 
                // If it's a legacy link, maybe just show it in the first column or ignore?
                // Let's assume global links go to "Work Link" column or Note column? 
                // But we removed "Work Link" column from table body logic (it was merged into notes).
                // Let's decide: Only show links that match the step. Or...
                // If we want to support legacy links, maybe we attach them to "อัป Raw" as default?
                if (stepLabel === 'อัป Raw') { // Default place for unlabeled links
                    html += `<a href="${linkStr}" target="_blank" class="step-link" title="Work Link">🔗 Link</a>`;
                }
            }
        });

        return html ? `<div style="margin-top: 4px;">${html}</div>` : '';
    }

    function formatNotes(note) {
        if (!note) return '-';
        const notes = String(note).split('\n').filter(n => n.trim());
        let html = '<div style="font-size: 0.75rem; color: #666; max-width: 200px; white-space: pre-wrap;">';
        notes.forEach(n => {
            html += `<div style="margin-bottom: 0.25rem;">📝 ${n.trim()}</div>`;
        });
        html += '</div>';
        return html;
    }

    function formatDuration(startTime, endTime) {
        if (!startTime || !endTime) return "";
        const start = new Date(startTime);
        const end = new Date(endTime);
        const diffMs = end - start;
        if (diffMs <= 0) return "";

        const diffHrs = diffMs / (1000 * 60 * 60);
        if (diffHrs < 1) {
            const mins = Math.round(diffMs / (1000 * 60));
            return `${mins} นาที`;
        }
        if (diffHrs < 24) {
            return `${diffHrs.toFixed(1)} ชม.`;
        }
        const days = Math.floor(diffHrs / 24);
        const remainingHrs = Math.round(diffHrs % 24);
        return `${days} วัน ${remainingHrs} ชม.`;
    }

    function openQueueModal(keepState = false) {
        const form = document.getElementById('queueForm');
        if (form && !keepState) {
            form.reset();
            if (typeof SlimSelect !== 'undefined') {
                if (ssQueueManga) ssQueueManga.setSelected('');
                // Reset Team Dropdowns
                const teamFields = ['uploaderName', 'extractorName', 'translatorName', 'typesetterName', 'publisherName', 'posterName'];
                teamFields.forEach(f => {
                    if (ssTeam[f]) ssTeam[f].setSelected('');
                });
                if (ssWebsites['transCategorySelect']) ssWebsites['transCategorySelect'].setData([]); // Categories are dynamic
            }
            // Manually clear specific added fields if they aren't part of form.reset() behavior in some contexts
            if (document.getElementById('rawLinkInput')) document.getElementById('rawLinkInput').value = '';
            if (document.getElementById('extractLinkInput')) document.getElementById('extractLinkInput').value = '';
        }

        if (!keepState) {
            if (document.getElementById('queueCostPerChapter')) document.getElementById('queueCostPerChapter').value = 0;
        } else {
            // If keeping state, ensure cost is set if manga is selected
            const mid = document.getElementById('queueMangaId').value;
            if (mid) {
                const manga = mangaList.find(m => m.mangaid != null && String(m.mangaid) === String(mid));
                if (manga && document.getElementById('queueCostPerChapter')) {
                    document.getElementById('queueCostPerChapter').value = manga.costperchapter || 0;
                }
            }
        }

        document.getElementById('queueModal').style.display = 'flex';
    }

    function closeQueueModal() {
        document.getElementById('queueModal').style.display = 'none';
    }

    function handleQueueSubmit(e) {
        e.preventDefault();
        const btn = e.target.querySelector('button[type="submit"]');
        const originalText = btn.innerText;

        const mangaId = document.getElementById('queueMangaId').value;
        const manga = mangaList.find(m => m.mangaid != null && mangaId != null && String(m.mangaid) === String(mangaId));
        const needsExtract = manga ? (manga.needsextract === true || manga.needsextract === 'true') : true;

        const rawLink = document.getElementById('rawLinkInput').value.trim();
        const extractLink = document.getElementById('extractLinkInput').value.trim();
        const mainLink = document.getElementById('workLink').value.trim();

        // Format step-specific links
        let combinedLinks = mainLink;
        if (rawLink) combinedLinks += (combinedLinks ? '\n' : '') + `[อัป Raw] ${rawLink} `;
        if (extractLink) combinedLinks += (combinedLinks ? '\n' : '') + `[ดึงคำ] ${extractLink} `;

        const queueData = {
            mangaid: mangaId,
            chapter: document.getElementById('queueChapter').value,
            uploadstatus: 'รอเริ่ม',
            uploadername: document.getElementById('uploaderName').value,
            extractstatus: needsExtract ? 'รอเริ่ม' : 'Skipped',
            extractorname: document.getElementById('extractorName').value,
            translatestatus: 'รอเริ่ม',
            translatorname: document.getElementById('translatorName').value,
            typesetstatus: 'รอเริ่ม',
            typesettername: document.getElementById('typesetterName').value,
            publishername: document.getElementById('publisherName').value,
            publishstatus: 'รอเริ่ม',
            poststatus: 'รอเริ่ม',
            worklink: combinedLinks,
            note: document.getElementById('queueNote').value
        };

        // === OPTIMISTIC UI UPDATE ===
        // 1. Prepare temp item
        const tempId = 'TEMP-' + new Date().getTime();
        const optimisticQueueItem = {
            ...queueData,
            queueid: tempId,
            createdat: new Date().toISOString(),
            uploadstatus: 'รอเริ่ม',
            extractstatus: needsExtract ? 'รอเริ่ม' : 'Skipped',
            translatestatus: 'รอเริ่ม',
            typesetstatus: 'รอเริ่ม',
            publishstatus: 'รอเริ่ม',
            poststatus: 'รอเริ่ม',
            manganame: manga ? manga.manganame : 'Unknown',
            isOptimistic: true
        };

        // 2. Backup current state
        const backupQueueList = [...queueList];
        const backupMangaList = [...mangaList];

        // 3. Update local data immediately
        queueList.unshift(optimisticQueueItem);

        // Update manga list locally (last chapter)
        if (manga) {
            const mIndex = mangaList.findIndex(m => m.mangaid != null && String(m.mangaid) === String(mangaId));
            if (mIndex !== -1) {
                const currentLast = parseFloat(mangaList[mIndex].lastchapter) || 0;
                const newChapterNum = parseFloat(queueData.chapter) || 0;
                if (newChapterNum >= currentLast) {
                    mangaList[mIndex].lastchapter = newChapterNum;
                    mangaList[mIndex].lastupdated = new Date().toISOString();
                }
            }
        }

        // 4. Update UI immediately
        closeQueueModal();
        renderMangaTable(mangaList); // Update Manga Table details too
        filterQueue();
        showToast('กำลังเพิ่มคิวงาน...');

        // Background call for Manga sync if cost changed
        const newCost = document.getElementById('queueCostPerChapter')?.value;
        if (newCost !== undefined && manga && parseFloat(newCost) !== parseFloat(manga.costperchapter || 0)) {
            google.script.run.updateManga(mangaId, { ...manga, costperchapter: newCost });
        }

        // Main background call
        google.script.run
            .withSuccessHandler(response => {
                if (response.error) {
                    console.error('Backend error:', response.error);
                    queueList = backupQueueList;
                    mangaList = backupMangaList;
                    filterQueue();
                    Swal.fire('Error', response.error, 'error');
                } else {
                    // Success - replace with real server data
                    queueList = response.queue;
                    filterQueue();
                    showToast('✅ เพิ่มคิวงานเรียบร้อยแล้ว');
                }
            })
            .withFailureHandler(err => {
                console.error('Backend failure:', err);
                queueList = backupQueueList;
                mangaList = backupMangaList;
                filterQueue();
                Swal.fire('Error', 'การเพิ่มคิวล้มเหลว: ' + err.message, 'error');
            })
            .addQueue(queueData);
    }

    function renderTeamTable(data) {
        const tbody = document.getElementById('teamTableBody');
        if (!tbody) return;
        tbody.innerHTML = '';

        if (!data || data.length === 0) {
            tbody.innerHTML = '<tr><td colspan="4" style="text-align: center; padding: 2rem; color: #666;">ยังไม่มีสมาชิกในทีม</td></tr>';
            return;
        }

        data.forEach(m => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
            <td style="padding: 1rem; border-bottom: 1px solid #eee;">
                    <div style="font-weight: 500;">${m.name}</div>
                    <div style="font-size: 0.75rem; color: #999;">ID: ${m.memberid}</div>
                </td>
                <td style="padding: 1rem; border-bottom: 1px solid #eee;">${m.role || '-'}</td>
                <td style="padding: 1rem; border-bottom: 1px solid #eee;">
                    <span style="padding: 0.2rem 0.6rem; border-radius: 1rem; font-size: 0.75rem; 
                        background: ${m.status === 'Active' ? '#dcfce7' : '#f1f5f9'}; 
                        color: ${m.status === 'Active' ? '#166534' : '#475569'};">
                        ${m.status || 'Active'}
                    </span>
                </td>
                <td style="padding: 1rem; border-bottom: 1px solid #eee; text-align: center;">
                    <button class="btn" style="padding: 0.25rem 0.5rem; font-size: 0.85rem; margin-right: 0.5rem;" onclick="editTeamMember('${m.memberid}')">✏️</button>
                    <button class="btn" style="padding: 0.25rem 0.5rem; background: #fee2e2; color: #dc2626;" onclick="deleteTeamMember('${m.memberid}')">🗑️</button>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

        e.preventDefault();

        btn.innerText = 'กำลังบันทึก...';
        btn.disabled = true;
        showLoader(true);

        const memberData = {
            name: document.getElementById('memberName').value,
            role: document.getElementById('memberRole').value,
            status: document.getElementById('memberStatus').value
        };

            // Edit mode

                    btn.innerText = originalText;
                    btn.disabled = false;
                    showLoader(false);
                    closeTeamModal();
                    showToast('อัปเดตข้อมูลสมาชิกเรียบร้อย');

                    btn.disabled = false;
                    showLoader(false);

                })

                .withSuccessHandler(data => {
                    btn.innerText = originalText;
                    btn.disabled = false;
                    showLoader(false);
                    closeTeamModal();
                    showToast('เพิ่มสมาชิกใหม่เรียบร้อย');
                    teamList = data;
                    renderTeamTable(teamList);
                    populateTeamDropdowns(teamList);
                })
                .withFailureHandler(err => {
                    btn.innerText = originalText;
                    btn.disabled = false;
                    showLoader(false);
                    Swal.fire('Error', err.message, 'error');
                })
                .addTeamMember(memberData);
        }
    }

    function editTeamMember(id) {
        if (!id) return;
        const member = teamList.find(m => m.memberid && m.memberid.toString() === id.toString());
        if (!member) return;

        document.getElementById('memberId').value = member.memberid;
        document.getElementById('memberName').value = member.name || '';
        document.getElementById('memberRole').value = member.role || 'Translator';
        document.getElementById('memberStatus').value = member.status || 'Active';

        document.getElementById('teamModalTitle').innerText = 'แก้ไขข้อมูลสมาชิก';
        document.getElementById('teamModal').style.display = 'flex';
    }

                        renderTeamTable(teamList);
                        populateTeamDropdowns(teamList);
                        showLoader(false);
