<script>
    let mangaList = [];
    let queueList = [];
    let teamList = [];
    let payeeList = [];
    const REFRESH_INTERVAL = 600000; // 10 minutes for production
    let lastRefreshTimestamp = new Date();
    let nextRefreshTimestamp = new Date(lastRefreshTimestamp.getTime() + REFRESH_INTERVAL);
    let isRefreshing = false;
    let refreshWatchdog = null;
    let isAuthorized = false;
    let ssQueueManga = null;
    let ssFinManga = null;
    let ssLockedTranslator = null;
    let ssTeam = {};
    let ssAssigneeFilter = null;
    let ssPayee = null;
    let ssWebsites = {};
    let selectedQueueIds = new Set();
    let currentFilteredQueue = [];

    // Initialize
    window.onload = function () {
        showLoader(true);
        initQueueFilters();
        initBudgetFilters();

        google.script.run
            .withSuccessHandler(data => {
                mangaList = Array.isArray(data.manga) ? data.manga : [];
                queueList = Array.isArray(data.queue) ? data.queue : [];
                teamList = Array.isArray(data.team) ? data.team : [];

                // Render core components
                financialSalesList = data.sales || [];
                // Populate Dropdowns
                websiteList = data.websites || [];
                populateMangaDropdown(mangaList);
                populateFinancialMangaDropdown(mangaList);
                populateWebsiteDropdown(websiteList);
                populateTeamDropdowns(teamList);
                populateAssigneeFilter(teamList);

                renderFinancialTable();
                renderRankings(financialSalesList);

                // This function likely renders the schedule view seen in the user's screenshot
                renderDashboard();
                renderMangaTable(mangaList);
                filterQueue();
                updateGlobalStats();
                updateQueueStats(queueList);
                // initFinancialFilters(); // Removed as per instruction's implied change

                showLoader(false);
                lastRefreshTimestamp = new Date();
                nextRefreshTimestamp = new Date(lastRefreshTimestamp.getTime() + REFRESH_INTERVAL);
                updateRefreshTimestamps();
                startHeartbeat(); // Start the countdown and auto-refresh cycle
            })
            .withFailureHandler(onError)
            .getDashboardData();
    };

    // --- BUDGET FUNCTIONS (Global) ---
    window.initBudgetFilters = function () {
        const monthSelect = document.getElementById('budgetMonthFilter');
        const yearSelect = document.getElementById('budgetYearFilter');
        if (!monthSelect || !yearSelect) return;

        const thaiMonths = ["มกราคม", "กุมภาพันธ์", "มีนาคม", "เมษายน", "พฤษภาคม", "มิถุนายน", "กรกฎาคม", "สิงหาคม", "กันยายน", "ตุลาคม", "พฤศจิกายน", "ธันวาคม"];
        monthSelect.innerHTML = '<option value="all">เดือน: ทั้งหมด</option>';
        thaiMonths.forEach((m, i) => {
            const opt = document.createElement('option');
            opt.value = (i + 1).toString();
            opt.textContent = m;
            monthSelect.appendChild(opt);
        });

        const now = new Date();
        const currentYear = now.getFullYear();
        yearSelect.innerHTML = '<option value="all">ปี: ทั้งหมด</option>';
        for (let i = 0; i < 6; i++) {
            const y = currentYear - i;
            const opt = document.createElement('option');
            opt.value = y.toString();
            opt.textContent = (y + 543).toString();
            yearSelect.appendChild(opt);
        }
        monthSelect.value = (now.getMonth() + 1).toString();
        yearSelect.value = 'all';
    };

    window.populateWebsiteDropdown = function (websites) {
        const ids = ['finWebsite', 'transCategorySelect'];
        const hardcoded = [
            'ReadRealm แปลจนเมื่อย',
            'ReadRealm น้องแมวส้ม',
            'ReadRealm แปลแล้วแปลอีก',
            'ReadRealm แปลจนแขนหัก'
        ];

        // Combine with provided list, avoiding duplicates
        let fullList = [...hardcoded];
        if (Array.isArray(websites)) {
            websites.forEach(w => {
                // Remove generic placeholders or "Other" if requested
                const isPlaceholder = w === 'Other' || w === 'ช่องทาง Readrealm' || w === 'Readrealm';
                if (w && !fullList.includes(w) && !isPlaceholder) {
                    fullList.push(w);
                }
            });
        }

        ids.forEach(id => {
            const select = document.getElementById(id);
            if (!select) return;
            select.innerHTML = '<option value="">-- เลือกช่องทาง --</option>';
            fullList.forEach(site => {
                const opt = document.createElement('option');
                opt.value = site;
                opt.textContent = site;
                select.appendChild(opt);
            });

            // Initialize/Update SlimSelect
            if (typeof SlimSelect !== 'undefined') {
                if (!ssWebsites[id]) {
                    ssWebsites[id] = new SlimSelect({
                        select: '#' + id,
                        settings: {
                            placeholderText: '-- เลือกช่องทาง --',
                            searchPlaceholderText: 'ค้นหาช่องทาง...',
                        }
                    });
                } else {
                    const data = fullList.map(s => ({ text: s, value: s }));
                    ssWebsites[id].setData([{ text: '-- เลือกช่องทาง --', value: '' }, ...data]);
                }
            }
        });
    };

    window.loadBudgetData = function () {
        showLoader(true);
        google.script.run
            .withSuccessHandler(data => {
                payeeList = Array.isArray(data.payees) ? data.payees : [];
                transactionList = Array.isArray(data.transactions) ? data.transactions : [];
                populatePayeeDropdown(payeeList);
                populateWebsiteDropdown(data.websites || []);
                renderPayeeTable(payeeList);
                filterBudgetTable();
                showLoader(false);
            })
            .withFailureHandler(onError)
            .getBudgetData();
    };

    window.loadTeamData = function () {
        showLoader(true);
        google.script.run
            .withSuccessHandler(data => {
                teamList = Array.isArray(data) ? data : [];
                renderTeamTable(teamList);
                populateTeamDropdowns(teamList);
                populateAssigneeFilter(teamList);
                showLoader(false);
            })
            .withFailureHandler(onError)
            .getTeamMembers();
    };

    window.filterBudgetTable = function () {
        const monthVal = document.getElementById('budgetMonthFilter').value;
        const yearVal = document.getElementById('budgetYearFilter').value;
        const typeVal = document.getElementById('budgetTypeFilter').value;
        let filtered = transactionList;
        if (monthVal !== 'all' || yearVal !== 'all') {
            filtered = filtered.filter(t => {
                if (!t.date) return false;
                const d = new Date(t.date);
                const mMatch = monthVal === 'all' || (d.getMonth() + 1).toString() === monthVal;
                const yMatch = yearVal === 'all' || d.getFullYear().toString() === yearVal;
                return mMatch && yMatch;
            });
        }
        if (typeVal !== 'all') filtered = filtered.filter(t => t.type === typeVal);
        renderBudgetTable(filtered);
        updateBudgetStats(filtered);
    };

    window.renderBudgetTable = function (data) {
        const tbody = document.getElementById('budgetTableBody');
        if (!tbody) return;
        tbody.innerHTML = '';
        if (!data || data.length === 0) {
            tbody.innerHTML = '<tr><td colspan="7" style="text-align: center; padding: 2rem; color: #64748b;">ไม่มีข้อมูลรายการบัญชี</td></tr>';
            return;
        }
        data.sort((a, b) => new Date(b.date) - new Date(a.date));
        data.forEach(t => {
            const tr = document.createElement('tr');
            const d = new Date(t.date);
            const dateStr = d.toLocaleDateString('th-TH');
            const isIncome = t.type === 'Income';
            tr.innerHTML = `
                <td style="padding: 1rem; border-bottom: 1px solid #eee; font-size: 0.85rem;">${dateStr}</td>
                <td style="padding: 1rem; border-bottom: 1px solid #eee;">
                    <span style="padding: 0.25rem 0.5rem; border-radius: 0.5rem; font-size: 0.75rem; font-weight: 600; background: ${isIncome ? '#dcfce7' : '#fee2e2'}; color: ${isIncome ? '#166534' : '#991b1b'};">${isIncome ? 'รายรับ' : 'รายจ่าย'}</span>
                </td>
                <td style="padding: 1rem; border-bottom: 1px solid #eee; font-weight: 500;">${t.category}</td>
                <td style="padding: 1rem; border-bottom: 1px solid #eee; font-size: 0.85rem; color: #475569;">${t.reference || '-'}</td>
                <td style="padding: 1rem; border-bottom: 1px solid #eee; text-align: right; font-weight: 600; color: ${isIncome ? '#166534' : '#b91c1c'};">${isIncome ? '+' : '-'}${parseFloat(t.amount).toLocaleString(undefined, { minimumFractionDigits: 2 })} ฿</td>
                <td style="padding: 1rem; border-bottom: 1px solid #eee; font-size: 0.8rem; color: #666;">${t.note || '-'}</td>
                <td style="padding: 1rem; border-bottom: 1px solid #eee; text-align: center;"><button class="btn" style="padding: 0.25rem 0.5rem; background: #fee2e2; color: #dc2626;" onclick="deleteTransaction('${t.transactionid}')">🗑️</button></td>
            `;
            tbody.appendChild(tr);
        });
    };

    window.updateBudgetStats = function (data) {
        let income = 0, expenses = 0;

        data.forEach(t => {
            if (t.type === 'Income') {
                income += parseFloat(t.amount) || 0;
            } else {
                expenses += parseFloat(t.amount) || 0;
            }
        });

        // 3. ภาษีหัก ณ ที่จ่าย 3% จากยอดรายจ่าย (จ่ายราคาเต็ม แต่หักส่วนต่างจากรายรับเพื่อนำส่ง)
        const tax3 = expenses * 0.03;

        // 4-5. เงินคงเหลือหลังหักรายจ่าย (ราคาเต็ม) และภาษี 3%
        const remainingBeforeFund = income - expenses - tax3;

        // 6. เงินคงเหลือ - 10% (หักเข้ากองกลาง/ระดมทุน)
        const centralFund = remainingBeforeFund > 0 ? remainingBeforeFund * 0.10 : 0;

        // 7. กำไรสุทธิ
        const netProfit = remainingBeforeFund - centralFund;

        setTextIfExist('budgetStatIncome', income.toLocaleString(undefined, { minimumFractionDigits: 2 }) + ' ฿');
        setTextIfExist('budgetStatExpense', expenses.toLocaleString(undefined, { minimumFractionDigits: 2 }) + ' ฿');
        setTextIfExist('budgetStatProfit', netProfit.toLocaleString(undefined, { minimumFractionDigits: 2 }) + ' ฿');
        setTextIfExist('budgetStatTax', tax3.toLocaleString(undefined, { minimumFractionDigits: 2 }) + ' ฿');
    };

    window.openTransactionModal = function () {
        document.getElementById('transactionForm').reset();
        document.getElementById('transDate').valueAsDate = new Date();
        if (typeof SlimSelect !== 'undefined') {
            if (ssPayee) ssPayee.setSelected('');
            if (ssWebsites['transCategorySelect']) ssWebsites['transCategorySelect'].setSelected('');
        }
        toggleTransFields();
        document.getElementById('transactionModal').style.display = 'flex';
    };

    window.closeTransactionModal = function () { document.getElementById('transactionModal').style.display = 'none'; };

    window.toggleTransFields = function () {
        const type = document.getElementById('transType').value;
        const payeeSelect = document.getElementById('transPayeeSelect');
        const refInput = document.getElementById('transReference');
        const catLabel = document.getElementById('transCategoryLabel');
        const refLabel = document.getElementById('transReferenceLabel');
        const catSelect = document.getElementById('transCategorySelect');
        const catInput = document.getElementById('transCategory');

        if (type === 'Expense') {
            catLabel.innerText = "หมวดหมู่ (เช่น ค่าตัวละคร, ค่าแปล)";
            refLabel.innerText = "จ่ายให้ใคร (เลือกจากรายชื่อ)";
            payeeSelect.style.display = 'block';
            payeeSelect.onchange = function () { if (this.value) refInput.value = this.value; };
            catSelect.style.display = 'none';
            catSelect.removeAttribute('required');
            catInput.style.display = 'block';
            catInput.setAttribute('required', 'true');
        } else {
            catLabel.innerText = "ช่องทางรายรับ (ReadRealm)";
            refLabel.innerText = "อ้างอิง (เช่น รหัสแคมเปญ)";
            payeeSelect.style.display = 'none';
            catSelect.style.display = 'block';
            catSelect.setAttribute('required', 'true');
            catInput.style.display = 'none';
            catInput.removeAttribute('required');
        }
    };

    window.handleTransactionSubmit = function (e) {
        e.preventDefault();
        const btn = e.target.querySelector('button[type="submit"]');
        const originalText = btn.innerText;
        btn.innerText = 'กำลังบันทึก...'; btn.disabled = true;
        const type = document.getElementById('transType').value;
        const category = type === 'Income' ? document.getElementById('transCategorySelect').value : document.getElementById('transCategory').value;

        const transData = {
            date: document.getElementById('transDate').value,
            type: type,
            category: category,
            reference: document.getElementById('transReference').value,
            amount: document.getElementById('transAmount').value,
            note: document.getElementById('transNote').value
        };
        showLoader(true);
        google.script.run
            .withSuccessHandler(res => {
                btn.innerText = originalText; btn.disabled = false; showLoader(false);
                if (res.error) Swal.fire('Error', res.error, 'error');
                else { closeTransactionModal(); showToast('บันทึกรายการเรียบร้อย'); transactionList = res.transactions; filterBudgetTable(); }
            })
            .withFailureHandler(onError).addBudgetTransaction(transData);
    };

    window.deleteTransaction = function (id) {
        Swal.fire({ title: 'ลบรายการนี้?', icon: 'warning', showCancelButton: true, confirmButtonColor: '#dc2626', confirmButtonText: 'ลบข้อมูล' }).then((result) => {
            if (result.isConfirmed) {
                showLoader(true);
                google.script.run.withSuccessHandler(res => { showToast('ลบรายการเรียบร้อย'); transactionList = res.transactions; filterBudgetTable(); showLoader(false); }).withFailureHandler(onError).deleteBudgetTransaction(id);
            }
        });
    };

    window.openPayeeModal = function () { hidePayeeForm(); renderPayeeTable(payeeList); document.getElementById('payeeModal').style.display = 'flex'; };
    window.closePayeeModal = function () { document.getElementById('payeeModal').style.display = 'none'; };
    window.showNewPayeeForm = function () {
        document.getElementById('payeeId').value = '';
        document.getElementById('payeeForm').reset();
        if (document.getElementById('payeeBankAccount')) document.getElementById('payeeBankAccount').value = '';
        if (document.getElementById('payeeBankName')) document.getElementById('payeeBankName').value = '';
        document.getElementById('payeeFormTitle').innerText = 'เพิ่มรายชื่อผู้รับเงิน';
        document.getElementById('payeeFormContainer').style.display = 'block';
    };
    window.hidePayeeForm = function () { document.getElementById('payeeFormContainer').style.display = 'none'; };

    window.handlePayeeSubmit = function (e) {
        e.preventDefault();
        const btn = e.target.querySelector('button[type="submit"]');
        const originalText = btn.innerText;
        btn.innerText = 'กำลังบันทึก...'; btn.disabled = true;
        const id = document.getElementById('payeeId').value;
        const data = {
            name: document.getElementById('payeeName').value,
            taxid: document.getElementById('payeeTaxId').value,
            bankaccount: document.getElementById('payeeBankAccount').value,
            bankname: document.getElementById('payeeBankName').value,
            note: document.getElementById('payeeNote').value
        };
        showLoader(true);
        const successHandler = res => {
            btn.innerText = originalText; btn.disabled = false; showLoader(false);
            if (res.error) Swal.fire('Error', res.error, 'error');
            else { hidePayeeForm(); showToast('บันทึกข้อมูลเรียบร้อย'); payeeList = res.payees; renderPayeeTable(payeeList); populatePayeeDropdown(payeeList); }
        };
        if (id) google.script.run.withSuccessHandler(successHandler).withFailureHandler(onError).updateBudgetPayee(id, data);
        else google.script.run.withSuccessHandler(successHandler).withFailureHandler(onError).addBudgetPayee(data);
    };

    window.editPayee = function (id) {
        const p = payeeList.find(x => x.payeeid === id.toString());
        if (!p) return;
        document.getElementById('payeeId').value = p.payeeid;
        document.getElementById('payeeName').value = p.name;
        document.getElementById('payeeTaxId').value = p.taxid;
        if (document.getElementById('payeeBankAccount')) document.getElementById('payeeBankAccount').value = p.bankaccount || '';
        if (document.getElementById('payeeBankName')) document.getElementById('payeeBankName').value = p.bankname || '';
        document.getElementById('payeeNote').value = p.note || '';
        document.getElementById('payeeFormTitle').innerText = 'แก้ไขข้อมูลผู้รับเงิน';
        document.getElementById('payeeFormContainer').style.display = 'block';
    };

    window.deletePayee = function (id) {
        Swal.fire({ title: 'ลบรายชื่อ?', icon: 'warning', showCancelButton: true, confirmButtonColor: '#dc2626', confirmButtonText: 'ลบข้อมูล' }).then((result) => {
            if (result.isConfirmed) {
                showLoader(true);
                google.script.run.withSuccessHandler(res => { showToast('ลบข้อมูลเรียบร้อย'); payeeList = res.payees; renderPayeeTable(payeeList); populatePayeeDropdown(payeeList); showLoader(false); }).withFailureHandler(onError).deleteBudgetPayee(id);
            }
        });
    };

    window.renderPayeeTable = function (data) {
        const tbody = document.getElementById('payeeTableBody');
        if (!tbody) return;
        tbody.innerHTML = '';
        data.forEach(p => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td style="padding: 0.75rem 1rem; border-bottom: 1px solid #eee; font-weight: 500;">${p.name}</td>
                <td style="padding: 0.75rem 1rem; border-bottom: 1px solid #eee; font-size: 0.85rem; color: #475569;">${p.taxid}</td>
                <td style="padding: 0.75rem 1rem; border-bottom: 1px solid #eee; font-size: 0.85rem; color: #475569;">${p.bankaccount || '-'}</td>
                <td style="padding: 0.75rem 1rem; border-bottom: 1px solid #eee; font-size: 0.85rem; color: #475569;">${p.bankname || '-'}</td>
                <td style="padding: 0.75rem 1rem; border-bottom: 1px solid #eee; font-size: 0.8rem; color: #666;">${p.note || '-'}</td>
                <td style="padding: 0.75rem 1rem; border-bottom: 1px solid #eee; text-align: center;">
                    <button class="btn" style="padding: 0.2rem 0.4rem; font-size: 0.8rem; margin-right: 0.4rem;" onclick="editPayee('${p.payeeid}')">✏️</button>
                    <button class="btn" style="padding: 0.2rem 0.4rem; font-size: 0.8rem; background: #fee2e2; color: #dc2626;" onclick="deletePayee('${p.payeeid}')">🗑️</button>
                </td>`;
            tbody.appendChild(tr);
        });
    };

    // --- FINANCIAL FUNCTIONS (Manga Sales) ---
    let financialSalesList = [];
    let chartWebsiteRevenueInstance = null;
    let chartMonthlyRevenueInstance = null;
    let chartWebsiteShareInstance = null;

    window.initFinancialFilters = function () {
        const monthSelect = document.getElementById('finMonthFilter');
        const yearSelect = document.getElementById('finYearFilter');
        if (!monthSelect || !yearSelect) return;

        const thaiMonths = ["มกราคม", "กุมภาพันธ์", "มีนาคม", "เมษายน", "พฤษภาคม", "มิถุนายน", "กรกฎาคม", "สิงหาคม", "กันยายน", "ตุลาคม", "พฤศจิกายน", "ธันวาคม"];
        monthSelect.innerHTML = '<option value="all">เดือน: ทั้งหมด</option>';
        thaiMonths.forEach((m, i) => {
            const opt = document.createElement('option');
            opt.value = (i + 1).toString();
            opt.textContent = m;
            monthSelect.appendChild(opt);
        });

        const now = new Date();
        const currentYear = now.getFullYear();
        yearSelect.innerHTML = '<option value="all">ปี: ทั้งหมด</option>';
        for (let i = 0; i < 6; i++) {
            const y = currentYear - i;
            const opt = document.createElement('option');
            opt.value = y.toString();
            opt.textContent = (y + 543).toString();
            yearSelect.appendChild(opt);
        }
        monthSelect.value = (now.getMonth() + 1).toString();
        yearSelect.value = 'all';
    };

    window.loadFinancialData = function () {
        showLoader(true);
        google.script.run
            .withSuccessHandler(data => {
                financialSalesList = Array.isArray(data.sales) ? data.sales : [];
                mangaList = Array.isArray(data.manga) ? data.manga : [];
                websiteList = data.websites || [];

                populateFinancialMangaDropdown(mangaList);
                populateWebsiteDropdown(websiteList);

                renderFinancialTable();
                renderFinancialCharts(financialSalesList);
                showLoader(false);
            })
            .withFailureHandler(onError)
            .getFinancialInitData();
    };

    window.renderFinancialTable = function () {
        const tbody = document.getElementById('financialTableBody');
        const monthVal = document.getElementById('finMonthFilter').value;
        const yearVal = document.getElementById('finYearFilter').value;

        if (!tbody) return;
        tbody.innerHTML = '';

        let filtered = financialSalesList;
        if (monthVal !== 'all' || yearVal !== 'all') {
            filtered = filtered.filter(s => {
                const d = new Date(s.date);
                const mMatch = monthVal === 'all' || (d.getMonth() + 1).toString() === monthVal;
                const yMatch = yearVal === 'all' || d.getFullYear().toString() === yearVal;
                return mMatch && yMatch;
            });
        }

        let totalRev = 0, totalCost = 0;

        filtered.sort((a, b) => new Date(b.date) - new Date(a.date));

        filtered.forEach((s, idx) => {
            const rev = parseFloat(s.revenue) || 0;
            const cost = parseFloat(s.totalcost) || 0;
            const profit = rev - cost;

            totalRev += rev;
            totalCost += cost;

            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td style="padding: 1rem; border-bottom: 1px solid #eee;">
                    <div style="font-weight: 600;">${s.seriesname}</div>
                    <div style="font-size: 0.75rem; color: #64748b;">${new Date(s.date).toLocaleDateString('th-TH')}</div>
                </td>
                <td style="padding: 1rem; border-bottom: 1px solid #eee; text-align: center;">${s.chapterscount}</td>
                <td style="padding: 1rem; border-bottom: 1px solid #eee; text-align: right;">${parseFloat(s.costperchapter).toLocaleString()} ฿</td>
                <td style="padding: 1rem; border-bottom: 1px solid #eee; text-align: right;">${cost.toLocaleString()} ฿</td>
                <td style="padding: 1rem; border-bottom: 1px solid #eee; text-align: right; font-weight: 600;">${rev.toLocaleString()} ฿</td>
                <td style="padding: 1rem; border-bottom: 1px solid #eee; text-align: right;">
                    <span style="padding: 0.25rem 0.5rem; border-radius:1rem; font-size: 0.75rem; font-weight: 600; background: ${profit >= 0 ? '#dcfce7' : '#fee2e2'}; color: ${profit >= 0 ? '#166534' : '#991b1b'};">
                        ${profit.toLocaleString()} ฿
                    </span>
                </td>
                <td style="padding: 1rem; border-bottom: 1px solid #eee; text-align: center;">
                    <button class="btn" style="padding: 0.25rem 0.5rem; background: #fee2e2; color: #dc2626;" onclick="deleteFinancialRecord(${idx})">🗑️</button>
                </td>
            `;
            tbody.appendChild(tr);
        });

        // Update stats
        setTextIfExist('totalRevenueM', totalRev.toLocaleString(undefined, { minimumFractionDigits: 2 }) + ' ฿');
        setTextIfExist('totalCostM', totalCost.toLocaleString(undefined, { minimumFractionDigits: 2 }) + ' ฿');
        setTextIfExist('totalProfitM', (totalRev - totalCost).toLocaleString(undefined, { minimumFractionDigits: 2 }) + ' ฿');

        renderRankings(filtered);
        renderFinancialCharts(filtered);
    };

    function renderRankings(data) {
        const profitList = document.getElementById('topProfitList');
        const lossList = document.getElementById('topLossList');
        if (!profitList || !lossList) return;

        // Aggregate by manga
        const summaryMap = {};
        data.forEach(s => {
            const name = s.seriesname || 'Unknown';
            const profit = (parseFloat(s.revenue) || 0) - (parseFloat(s.totalcost) || 0);
            if (!summaryMap[name]) summaryMap[name] = 0;
            summaryMap[name] += profit;
        });

        const sorted = Object.keys(summaryMap).map(name => ({ name, profit: summaryMap[name] }));

        // Render Profit Rankings
        const profits = sorted.filter(p => p.profit > 0).sort((a, b) => b.profit - a.profit).slice(0, 10);
        profitList.innerHTML = profits.length ? profits.map((p, idx) => `
            <div style="display: flex; justify-content: space-between; padding: 0.5rem 0; border-bottom: 1px solid #f1f5f9;">
                <span>${idx + 1}. ${p.name}</span>
                <span style="color: #16a34a; font-weight: 600;">+${p.profit.toLocaleString()} ฿</span>
            </div>
        `).join('') : '<p style="color: #94a3b8; text-align: center; padding: 1rem;">ไม่มีข้อมูลกำไร</p>';

        // Render Loss Rankings
        const losses = sorted.filter(p => p.profit < 0).sort((a, b) => a.profit - b.profit).slice(0, 10);
        lossList.innerHTML = losses.length ? losses.map((p, idx) => `
            <div style="display: flex; justify-content: space-between; padding: 0.5rem 0; border-bottom: 1px solid #f1f5f9;">
                <span>${idx + 1}. ${p.name}</span>
                <span style="color: #dc2626; font-weight: 600;">${p.profit.toLocaleString()} ฿</span>
            </div>
        `).join('') : '<p style="color: #94a3b8; text-align: center; padding: 1rem;">ไม่มีข้อมูลขาดทุน</p>';
    }

    window.handleBulkImport = function () {
        const text = document.getElementById('bulkImportText').value.trim();
        if (!text) {
            Swal.fire('Warning', 'กรุณาวางข้อมูลก่อนกดนำเข้า', 'warning');
            return;
        }

        const lines = text.split('\n');
        const sales = [];

        // Detect delimiter: Check if more tabs or commas in the first few non-empty lines
        let delimiter = '\t';
        const sampleLines = lines.slice(0, 5).filter(l => l.trim());
        if (sampleLines.length > 0) {
            const tabs = (sampleLines[0].match(/\t/g) || []).length;
            const commas = (sampleLines[0].match(/,/g) || []).length;
            if (commas > tabs) delimiter = ',';
        }

        console.log('Detected delimiter:', delimiter === '\t' ? 'TAB' : 'COMMA');

        function parseLine(line) {
            const result = [];
            let cur = '';
            let inQuote = false;
            for (let i = 0; i < line.length; i++) {
                const char = line[i];
                if (char === '"') {
                    inQuote = !inQuote;
                } else if (char === delimiter && !inQuote) {
                    result.push(cur.trim());
                    cur = '';
                } else {
                    cur += char;
                }
            }
            result.push(cur.trim());
            // Remove surround quotes and handle escaped double quotes
            return result.map(s => s.replace(/^"|"$/g, '').replace(/""/g, '"').trim());
        }

        try {
            lines.forEach((line) => {
                if (!line.trim()) return;
                const cols = parseLine(line);

                // Header row or non-data row check
                if (cols.length < 10) return; // Allow some missing columns if needed, but at least 10
                if (cols[0].includes('วันที่') || cols[3]?.includes('เรื่อง')) return;

                const cleanNum = (str) => {
                    if (!str) return 0;
                    // Remove commas and handle parentheses for negative numbers if any
                    let cleaned = str.replace(/,/g, '').trim();
                    if (cleaned.startsWith('(') && cleaned.endsWith(')')) {
                        cleaned = '-' + cleaned.substring(1, cleaned.length - 1);
                    }
                    return parseFloat(cleaned) || 0;
                };

                // Date normalization logic
                let dateStr = cols[0].trim();
                let day = '30', monthStr = '01', year = 2025;

                const dateParts = dateStr.split('/');
                if (dateParts.length === 3) {
                    day = dateParts[0].padStart(2, '0');
                    monthStr = dateParts[1].padStart(2, '0');
                    let yr = parseInt(dateParts[2]);

                    // Handle BE (2568) or short BE (68) or CE interpretations
                    if (yr > 2500) year = yr - 543;
                    else if (yr === 68 || yr === 25) year = 2025;
                    else if (yr === 1968) year = 2025; // Spreadsheet bug often maps 68 BE to 1968 CE
                    else if (yr < 100) year = 2000 + yr;
                    else year = yr;
                } else {
                    // Fallback to month column (expected YYYY-MM or similar)
                    const mParts = cols[1].split('-');
                    if (mParts.length >= 2) {
                        year = parseInt(mParts[0]);
                        if (year === 1968) year = 2025;
                        monthStr = mParts[1];
                    }
                }
                const normalizedDate = `${year}-${monthStr.padStart(2, '0')}-${day.padStart(2, '0')}`;

                // Mapping based on the user's CSV (index 4 is skipped "ตอน")
                // User clarified that index 9 (Col 10) is the "Monthly Target" (not per chapter)
                const monthlyTarget = cleanNum(cols[9]);
                const chapters = cleanNum(cols[5]);

                sales.push({
                    date: normalizedDate,
                    month: cols[1].trim(),
                    serieschapterid: cols[2].trim(),
                    seriesname: cols[3].trim(),
                    chapterscount: chapters,
                    category: cols[6].trim(),
                    website: (cols[7] === 'websiteA.co') ? "ช่องทาง Readrealm" : (cols[7] || "ช่องทาง Readrealm"),
                    page: (cols[8] || "Page").trim(),
                    targetperchapter: chapters > 0 ? (monthlyTarget / chapters) : monthlyTarget,
                    totaltarget: monthlyTarget,
                    costperchapter: cleanNum(cols[11]),
                    totalcost: cleanNum(cols[12]),
                    revenue: monthlyTarget // Use Monthly Target as revenue base
                });
            });

            if (sales.length === 0) {
                Swal.fire('Error', 'ไม่พบข้อมูลที่ถูกต้อง กรุณาใช้ข้อมูลแบบคั่นด้วย Tab หรือ CSV', 'error');
                return;
            }

            Swal.fire({
                title: 'ยืนยันการนำเข้า',
                text: `ตรวจพบข้อมูล ${sales.length} รายการ ต้องการนำเข้าหรือไม่ ? `,
                icon: 'question',
                showCancelButton: true,
                confirmButtonText: 'ตกลง',
                cancelButtonText: 'ยกเลิก'
            }).then((result) => {
                if (result.isConfirmed) {
                    showLoader(true);
                    google.script.run
                        .withSuccessHandler(res => {
                            showLoader(false);
                            if (res.error) Swal.fire('Error', res.error, 'error');
                            else {
                                Swal.fire('สำเร็จ', `นำเข้าข้อมูล ${res.count} รายการเรียบร้อย`, 'success');
                                document.getElementById('bulkImportModal').style.display = 'none';
                                document.getElementById('bulkImportText').value = '';

                                google.script.run
                                    .withSuccessHandler(data => {
                                        financialSalesList = data.sales || [];
                                        renderFinancialTable();
                                    })
                                    .getFinancialInitData();
                            }
                        })
                        .withFailureHandler(onError)
                        .bulkAddMangaSales(sales);
                }
            });
        } catch (e) {
            Swal.fire('Error', 'เกิดข้อผิดพลาด: ' + e.message, 'error');
        }
    };

    window.renderFinancialCharts = function (sales) {

        const websiteRevenue = {};
        // 2. Monthly Revenue per Website (for Line) -> Structure: { "2024-01": { "MangaPlus": 100, "Kakao": 200 } }
        const monthlyWebsiteRevenue = {};
        const websitesSet = new Set();
        const allMonthsSet = new Set();

        sales.forEach(s => {
            const web = s.website || 'Other';
            const rev = parseFloat(s.revenue) || 0;
            const cost = parseFloat(s.totalcost) || 0;
            const net = rev - cost;

            // Use manual split or getUTC to avoid timezone shift from GAS to browser
            let y, m;
            if (s.date && s.date.includes('T')) {
                const dt = new Date(s.date);
                y = dt.getUTCFullYear();
                m = dt.getUTCMonth() + 1;
            } else {
                const dParts = s.date.toString().split('-');
                y = parseInt(dParts[0]);
                m = parseInt(dParts[1]);
            }
            const monthKey = `${y}-${String(m).padStart(2, '0')}`;

            // Total Net (for Share & Website Stats)
            websiteRevenue[web] = (websiteRevenue[web] || 0) + rev; // Keep rev for share pie if desired, but net for trend

            // Monthly Net
            if (!monthlyWebsiteRevenue[monthKey]) monthlyWebsiteRevenue[monthKey] = {};
            // Aggregating Net for the trend chart
            monthlyWebsiteRevenue[monthKey][web] = (monthlyWebsiteRevenue[monthKey][web] || 0) + net;

    // --- ROBUST HEARTBEAT SYSTEM ---
    function startHeartbeat() {
        // Interval runs every 1 second to update UI and check watchdog
        setInterval(() => {
            const now = new Date();
            const diffMs = nextRefreshTimestamp - now;
            const diffSec = Math.max(0, Math.floor(diffMs / 1000));

            // Update Countdown UI
            const countdownEl = document.getElementById('countdownText');
            if (countdownEl) countdownEl.textContent = diffSec;

            // Trigger Refresh if due
            if (diffSec <= 0 && !isRefreshing) {
                performRefresh();
            }
        }, 1000);
    }

    function performRefresh() {
        if (isRefreshing) {
            console.warn('Heartbeat: Refresh already in progress, skipping...');
            return;
        }
        isRefreshing = true;

        // Watchdog: If GAS doesn't respond in 2 minutes, force reset
        clearTimeout(refreshWatchdog);
        refreshWatchdog = setTimeout(() => {
            if (isRefreshing) {
                console.error('Heartbeat: GAS call timed out after 2 minutes. Force resetting...');
                isRefreshing = false;
                updateRefreshTimestamps(false);
            }
        }, 120000);

        console.log('Heartbeat: Triggering refresh...');
        updateRefreshTimestamps(true); // Show "Refreshing..."

        google.script.run
            .withSuccessHandler(data => {
                clearTimeout(refreshWatchdog);
                if (!data) {
                    console.error('Heartbeat: Received null data');
                    isRefreshing = false;
                    updateRefreshTimestamps(false);
                    return;
                }

                // Update all global lists
                mangaList = Array.isArray(data.manga) ? data.manga : mangaList;
                queueList = Array.isArray(data.queue) ? data.queue : queueList;
                teamList = Array.isArray(data.team) ? data.team : teamList;
                financialSalesList = Array.isArray(data.sales) ? data.sales : financialSalesList;
                payeeList = Array.isArray(data.payees) ? data.payees : payeeList;
                transactionList = Array.isArray(data.transactions) ? data.transactions : transactionList;
                websiteList = Array.isArray(data.websites) ? data.websites : websiteList;

                // Sync UI Components
                updateGlobalStats();
                updateQueueStats(queueList);
                populateMangaDropdown(mangaList);
                populateFinancialMangaDropdown(mangaList);
                populateWebsiteDropdown(websiteList);
                populateTeamDropdowns(teamList);
                populateAssigneeFilter(teamList);
                populatePayeeDropdown(payeeList);

                // Re-render currently active view
                const activeNav = document.querySelector('.nav-item.active');
                if (activeNav) {
                    const viewId = activeNav.id.replace('nav-', '');
                    console.log('Heartbeat: Re-rendering active view:', viewId);
                    try {
                        if (viewId === 'dashboard') renderDashboard();
                        else if (viewId === 'queue') filterQueue();
                        else if (viewId === 'team') renderTeamTable(teamList || []);
                        else if (viewId === 'financials') renderFinancialTable();
                        else if (viewId === 'budget') filterBudgetTable();
                        else if (viewId === 'settings') renderMangaTable(mangaList || []);
                    } catch (e) {
                        console.error('Heartbeat: Error rendering view:', e);
                    }
                }

                // Update timestamps for next cycle
                lastRefreshTimestamp = new Date();
                nextRefreshTimestamp = new Date(lastRefreshTimestamp.getTime() + REFRESH_INTERVAL);
                isRefreshing = false;
                updateRefreshTimestamps(false);
                console.log('Heartbeat: Refresh success at ' + lastRefreshTimestamp.toLocaleTimeString());
            })
            .withFailureHandler(err => {
                clearTimeout(refreshWatchdog);
                console.error('Heartbeat: Refresh failed:', err);
                lastRefreshTimestamp = new Date();
                nextRefreshTimestamp = new Date(lastRefreshTimestamp.getTime() + REFRESH_INTERVAL);
                isRefreshing = false;
                updateRefreshTimestamps(false);
            })
            .getDashboardData();
    }

    // Helper: Update refresh timestamps in UI
    function updateRefreshTimestamps(isLoading) {
        const lastEl = document.getElementById('lastFetchTime');
        const nextEl = document.getElementById('nextFetchTime');
        const statusText = document.getElementById('refreshStatusText');
        const icon = document.querySelector('.pulse-icon');

        if (isLoading) {
            if (statusText) statusText.textContent = 'กำลังดึงข้อมูล...';
            if (icon) {
                icon.style.background = '#f59e0b'; // Amber for loading
                icon.classList.add('loading-spin');
            }
        } else {
            if (statusText) statusText.textContent = 'สถานะคลาวด์: เชื่อมต่อปกติ';
            if (icon) {
                icon.style.background = '#22c55e'; // Green for OK
                icon.classList.remove('loading-spin');
            }
            if (lastEl) lastEl.textContent = lastRefreshTimestamp.toLocaleTimeString('th-TH');
            if (nextEl) nextEl.textContent = nextRefreshTimestamp.toLocaleTimeString('th-TH');
        }

    // --- QUEUE STATS ---
    function updateQueueStats(data) {
        if (!data) return;

        let finished = 0, waitUpload = 0, waitExtract = 0, waitTranslate = 0, waitTypeset = 0, waitPublish = 0, waitPost = 0;
        const isDone = (s) => {
            const str = (s || '').toString().trim();
            return str === 'เสร็จแล้ว' || str === 'Skipped' || str === 'ข้าม' || str.toLowerCase() === 'done';
        };
        const getStatus = (s) => (s === undefined || s === null || String(s).trim() === '') ? 'รอเริ่ม' : String(s).trim();

        data.forEach(q => {
            const count = getChapterCount(q.chapter);
            const postSt = getStatus(q.poststatus);
            if (isDone(q.poststatus)) finished += count;
            else {
                if (getStatus(q.uploadstatus) === 'รอเริ่ม' || getStatus(q.uploadstatus) === 'กำลังทำ') waitUpload += count;
                if ((getStatus(q.extractstatus) === 'รอเริ่ม' || getStatus(q.extractstatus) === 'กำลังทำ') && getStatus(q.extractstatus) !== 'Skipped') waitExtract += count;
                if (getStatus(q.translatestatus) === 'รอเริ่ม' || getStatus(q.translatestatus) === 'กำลังทำ') waitTranslate += count;
                if (getStatus(q.typesetstatus) === 'รอเริ่ม' || getStatus(q.typesetstatus) === 'กำลังทำ') waitTypeset += count;
                if (getStatus(q.publishstatus) === 'รอเริ่ม' || getStatus(q.publishstatus) === 'กำลังทำ') waitPublish += count;
                if ((postSt === 'รอเริ่ม' || postSt === 'กำลังทำ') && (isDone(q.publishstatus) || postSt === 'กำลังทำ')) waitPost += count;
            }
        });

        // Update DOM
        setTextIfExist('qStatFinished', finished);
        setTextIfExist('qStatUpload', waitUpload);
        setTextIfExist('qStatExtract', waitExtract);
        setTextIfExist('qStatTranslate', waitTranslate);
        setTextIfExist('qStatTypeset', waitTypeset);
        setTextIfExist('qStatPublish', waitPublish);
        setTextIfExist('qStatPost', waitPost);
    }

    function parseQueueDate(dateStr) {
        if (!dateStr) return null;
        if (dateStr instanceof Date) return isNaN(dateStr.getTime()) ? null : dateStr;
        // รูปแบบไทย วัน/เดือน/ปี (อาจมีเวลาต่อท้าย) — ต้อง parse เองก่อน
        // ไม่งั้น new Date() จะอ่านเป็น เดือน/วัน/ปี แบบอเมริกัน ทำให้เดือนผิด
        if (typeof dateStr === 'string' && dateStr.includes('/')) {
            const parts = dateStr.trim().split(' ')[0].split('/');
            if (parts.length === 3) {
                let yr = +parts[2];
                if (yr > 2400) yr -= 543;
                const d = new Date(yr, +parts[1] - 1, +parts[0]);
                return isNaN(d.getTime()) ? null : d;
            }
        }
        // ISO string หรือรูปแบบมาตรฐานอื่น ๆ
        const d = new Date(dateStr);
        return isNaN(d.getTime()) ? null : d;
    }

    function filterQueue() {
        // Search Input
        const searchInput = document.getElementById('searchInput');
        const rawSearch = searchInput ? searchInput.value.toLowerCase().trim() : '';
        const searchVal = rawSearch.replace(/\.\.\.+$/, '').replace(/…+$/, '').trim();

        const completionVal = document.getElementById('completionFilter').value;
        const stepVal = document.getElementById('stepFilter').value;
        const assigneeVal = document.getElementById('assigneeFilter').value;
        const urgentEl = document.getElementById('urgentFilter');
        const urgentVal = urgentEl ? urgentEl.value : 'all';
        const monthVal = document.getElementById('monthFilter').value;
        const yearVal = document.getElementById('yearFilter').value;

        let filtered = queueList;

        // Filter by Month/Year
        if (monthVal !== 'all' || yearVal !== 'all') {
            filtered = filtered.filter(q => {
                const d = parseQueueDate(q.createdat);
                if (!d) return false;
                const mMatch = monthVal === 'all' || (d.getMonth() + 1).toString() === monthVal;
                const yMatch = yearVal === 'all' || d.getFullYear().toString() === yearVal;
                return mMatch && yMatch;
            });
        }

        // Filter by Search Text (Realtime)
        if (searchVal) {
            filtered = filtered.filter(q => {
                const manga = mangaList.find(m => m.mangaid != null && q.mangaid != null && String(m.mangaid) === String(q.mangaid));
                const mangaName = manga ? manga.manganame.toLowerCase() : '';
                // You can also search by queueid or note if desired
                return mangaName.includes(searchVal);
            });
        }

        // Filter by Completion Status
        if (completionVal !== 'all') {
            filtered = filtered.filter(q => {
                const isFinished = q.poststatus === 'เสร็จแล้ว';
                if (completionVal === 'complete') return isFinished;
                if (completionVal === 'incomplete') return !isFinished;
                return true;
            });
        }

        // Filter by Step Status
        if (stepVal !== 'all') {
            filtered = filtered.filter(q => {
                const statusField = stepVal + 'status';
                const rawStatus = q[statusField];
                // Treat missing/empty/whitespace status as 'รอเริ่ม' (consistent with UI badge default)
                const status = (rawStatus === undefined || rawStatus === null || String(rawStatus).trim() === '') ? 'รอเริ่ม' : String(rawStatus).trim();

                // Helper to check if a step is "Done" (finished or skipped)
                const isDone = (s) => {
                    const str = (s || '').toString().trim();
                    return str === 'เสร็จแล้ว' || str === 'Skipped' || str === 'ข้าม' || str.toLowerCase() === 'done';
                };

                // Check if status is 'Waiting' or 'In Progress'
                const isPending = (status === 'รอเริ่ม' || status === 'กำลังทำ');
                if (!isPending) return false;

                // SPECIAL CONDITIONS:
                // 1. If filtering for "Post" (โพสต์):
                //    Previous step "Publish" must be Finished/Skipped, OR post is already 'กำลังทำ'
                if (stepVal === 'post' && !isDone(q.publishstatus) && status !== 'กำลังทำ') return false;

                // 2. If filtering for "Publish", "Typeset" (ลงคำ) must be Finished/Skipped
                if (stepVal === 'publish' && !isDone(q.typesetstatus)) return false;

                // 3. If filtering for "Typeset" (ลงคำ), "Translate" (แปล) must be Finished/Skipped
                if (stepVal === 'typeset' && !isDone(q.translatestatus)) return false;

                return true;
            });
        }

        // Filter by Assignee
        if (assigneeVal !== 'all') {
            filtered = filtered.filter(q => {
                // Check if this person is assigned to ANY role in this item
                return q.uploadername === assigneeVal ||
                    q.extractorname === assigneeVal ||
                    q.translatorname === assigneeVal ||
                    q.typesettername === assigneeVal ||
                    q.publishername === assigneeVal ||
                    q.postername === assigneeVal;
            });
        }

        // Filter by Urgency (งานด่วน / ไม่ด่วน)
        if (urgentVal !== 'all') {
            filtered = filtered.filter(q => {
                const manga = mangaList.find(m => m.mangaid != null && q.mangaid != null && String(m.mangaid) === String(q.mangaid));
                const urgent = isUrgentManga(manga);
                return urgentVal === 'urgent' ? urgent : !urgent;
            });
        }

        currentFilteredQueue = filtered;

        // Auto-sync step in bulk action bar when stepFilter is chosen
        if (stepVal !== 'all') {
            const bulkStepEl = document.getElementById('bulkStepSelect');
            if (bulkStepEl) bulkStepEl.value = stepVal;
        }

        renderQueueTable(filtered);
        if (typeof updateBulkActionBar === 'function') {
            updateBulkActionBar();
        }
    }

    function updateGlobalStats() {
        if (!mangaList || mangaList.length === 0) return;

        // 1. Update Stats Cards
        const totalManga = mangaList.length;
        const activeQueueItems = queueList.filter(q => q.poststatus !== 'เสร็จแล้ว');
        const pendingCount = activeQueueItems.length;

        // Finished this week (Last 7 days)
        const sevenDaysAgo = new Date();
        sevenDaysAgo.setDate(sevenDaysAgo.getDate() - 7);
        let finishedThisWeekCount = 0;
        queueList.forEach(q => {
            if (q.poststatus === 'เสร็จแล้ว' && new Date(q.createdat) >= sevenDaysAgo) {
                finishedThisWeekCount += getChapterCount(q.chapter);
            }
        });

        // Released Today
        const todayDay = getThaiDayName(new Date());
        const releasedToday = mangaList.filter(m =>
            m.status === 'Ongoing' &&
            m.releaseday && m.releaseday.split(',').map(d => d.trim()).includes(todayDay)
        ).length;

        setTextIfExist('totalSeries', totalManga);
        setTextIfExist('pendingSeries', pendingCount);
        setTextIfExist('finishedThisWeek', finishedThisWeekCount);
        setTextIfExist('releasedToday', releasedToday);
    }

    function getChapterCount(chapterStr, treatSingleAsCount = false) {
        if (!chapterStr) return 0;
        const s = chapterStr.toString().trim();
        if (s.includes('-')) {
            const parts = s.split('-').map(p => parseFloat(p.trim()));
            if (parts.length >= 2 && !isNaN(parts[0]) && !isNaN(parts[1])) {
                const count = Math.abs(parts[1] - parts[0]) + 1;
                return Math.max(0, count);
            }
        }
        const val = parseFloat(s);
        if (isNaN(val)) return 0;
        return treatSingleAsCount ? val : 1;
    }

    function getQueueCurrentStep(q) {
        if (!q) return 'finished';
        const isDone = (s) => {
            const str = (s || '').toString().trim();
            return str === 'เสร็จแล้ว' || str === 'Skipped' || str === 'ข้าม' || str.toLowerCase() === 'done';
        };
        const isDoing = (s) => String(s || '').trim() === 'กำลังทำ';

        // Check if explicitly in progress
        if (isDoing(q.typesetstatus)) return 'typeset';
        if (isDoing(q.translatestatus)) return 'translate';
        if (isDoing(q.extractstatus)) return 'extract';
        if (isDoing(q.publishstatus)) return 'publish';
        if (isDoing(q.poststatus)) return 'post';
        if (isDoing(q.uploadstatus)) return 'upload';

        // Otherwise sequential pipeline
        if (!isDone(q.uploadstatus)) return 'upload';
        if (!isDone(q.extractstatus)) return 'extract';
        if (!isDone(q.translatestatus)) return 'translate';
        if (!isDone(q.typesetstatus)) return 'typeset';
        if (!isDone(q.publishstatus)) return 'publish';
        if (!isDone(q.poststatus)) return 'post';
        return 'finished';
    }

    function renderMonthlySchedule() {
        // Renamed from renderWeeklySchedule but keeping call site consistent in future update
        // (Note: You must also update the call in renderDashboard to point here)

        const calendarContainer = document.getElementById('monthlySchedule');
        if (!calendarContainer) return;
        calendarContainer.innerHTML = '';

        // 1. Get Current Month & Year
        const now = new Date();
        const year = now.getFullYear();
        const month = now.getMonth(); // 0-11

        // Update Label
        const thaiMonths = [
            "มกราคม", "กุมภาพันธ์", "มีนาคม", "เมษายน", "พฤษภาคม", "มิถุนายน",
            "กรกฎาคม", "สิงหาคม", "กันยายน", "ตุลาคม", "พฤศจิกายน", "ธันวาคม"
        ];
        const label = document.getElementById('calendarMonthLabel');
        if (label) label.innerText = `${thaiMonths[month]} ${year + 543} `;

        // 2. Render Headers (Sun-Sat or Mon-Sun)
        // Let's use Sun-Sat for standard calendar, but Thai usually likes Mon-Sun? Let's stick to Mon-Sun to match work week
        const dayHeaders = ['จ.', 'อ.', 'พ.', 'พฤ.', 'ศ.', 'ส.', 'อา.'];
        dayHeaders.forEach(d => {
            const h = document.createElement('div');
            h.className = 'calendar-header';
            h.innerText = d;
            calendarContainer.appendChild(h);
        });

        // 3. Calculate Calendar Days
        // First day of month
        const firstDay = new Date(year, month, 1);
        const lastDay = new Date(year, month + 1, 0);

        // Adjust for Mon start (Day 0 is Sunday)
        let firstDayIndex = firstDay.getDay() - 1;
        if (firstDayIndex < 0) firstDayIndex = 6; // Sunday becomes 6

        const daysInMonth = lastDay.getDate();

        // Previous Month Padding
        for (let i = 0; i < firstDayIndex; i++) {
            const pad = document.createElement('div');
            pad.className = 'calendar-day other-month';
            calendarContainer.appendChild(pad);
        }

        // Current Month Days
        for (let day = 1; day <= daysInMonth; day++) {
            const date = new Date(year, month, day);
            const dayOfWeek = getThaiDayName(date); // Your existing function returns 'วันจันทร์' etc.
            const dateStr = date.toLocaleDateString('th-TH'); // d/m/yyyy format matching typically

            const cell = document.createElement('div');
            cell.className = 'calendar-day';
            const isToday = day === now.getDate() && month === now.getMonth() && year === now.getFullYear();
            if (isToday) cell.classList.add('today');

            // Day Number
            cell.innerHTML = `<div class="day-number">${day} ${isToday ? '<span style="color:var(--primary-color)">วันนี้</span>' : ''}</div>`;

            // A. Find Scheduled Manga (from Metadata)
            // Show ONLY if releaseday matches. 
            // NOTE: If today is past, maybe don't show "Scheduled" if no Queue was created? 
            // Or just show everything to show the Plan. Let's show everything but style differently.

            const scheduledManga = mangaList.filter(m =>
                m.status === 'Ongoing' &&
                m.releaseday && m.releaseday.split(',').map(d => d.trim()).includes(dayOfWeek)
            );

            // B. Find Actual Queue Items (Manual + Auto) created on this day
            // We match by comparing Date parts of createdat
            // Show ONLY tasks in steps: รอดึงคำ (extract), รอแปล (translate), ลงคำ/รอลงคำ (typeset)
            const allowedMonthlySteps = ['extract', 'translate', 'typeset'];
            const queueItemsOnDay = queueList.filter(q => {
                const qDate = parseQueueDate(q.createdat) || new Date(q.createdat);
                if (!qDate || isNaN(qDate.getTime())) return false;
                const isSameDay = qDate.getDate() === day && qDate.getMonth() === month && qDate.getFullYear() === year;
                if (!isSameDay) return false;

                const stepKey = getQueueCurrentStep(q);
                return allowedMonthlySteps.includes(stepKey);
            });

            // Priority sorting according to requirement:
            // 1. งาน รอแปล (ด่วน) -> อันดับ 1 บนสุด (สีแดง)
            // 2. งาน รอแปล (ปกติ) -> อันดับ 2 (สีเหลือง)
            // 3. งานลงคำ (กำลังทำ) -> อันดับ 3 (สีเขียว)
            // 4. งานรอลงคำ (รอเริ่ม) -> อันดับ 4 (สีส้ม)
            // 5. อื่นๆ (เช่น รอดึงคำ)
            function getMonthlyTaskPriority(q) {
                const manga = mangaList.find(m => m.mangaid != null && q.mangaid != null && String(m.mangaid) === String(q.mangaid));
                const isUrgent = isUrgentManga(manga);
                const stepKey = getQueueCurrentStep(q);

                if (stepKey === 'translate') {
                    return isUrgent ? 1 : 2; // 1: รอแปล (ด่วน), 2: รอแปล (ปกติ)
                }
                if (stepKey === 'typeset') {
                    const isDoing = String(q.typesetstatus || '').trim() === 'กำลังทำ';
                    return isDoing ? 3 : 4; // 3: งานลงคำ, 4: งานรอลงคำ
                }
                if (stepKey === 'extract') return 5;
                return 6;
            }

            queueItemsOnDay.sort((a, b) => {
                const pA = getMonthlyTaskPriority(a);
                const pB = getMonthlyTaskPriority(b);
                if (pA !== pB) return pA - pB;
                const mangaA = mangaList.find(m => m.mangaid != null && a.mangaid != null && String(m.mangaid) === String(a.mangaid));
                const mangaB = mangaList.find(m => m.mangaid != null && b.mangaid != null && String(m.mangaid) === String(b.mangaid));
                const urgA = isUrgentManga(mangaA) ? 1 : 0;
                const urgB = isUrgentManga(mangaB) ? 1 : 0;
                if (urgA !== urgB) return urgB - urgA;
                return (a.queueid || 0) - (b.queueid || 0);
            });

            // COMBINE
            const renderedMangaIds = new Set();
            const MAX_DISPLAY = 5;

            // 1. Queue Items (Priority) - Limit to Top 5
            queueItemsOnDay.slice(0, MAX_DISPLAY).forEach(q => {
                const manga = mangaList.find(m => m.mangaid != null && q.mangaid != null && String(m.mangaid) === String(q.mangaid));
                const fullName = manga ? manga.manganame : 'Unknown';
                let displayName = fullName;
                const isUrgent = isUrgentManga(manga);
                if (displayName.length > 22) displayName = displayName.substring(0, 22) + '...';

                // ตัด ... หรือ … ท้ายชื่อออกเมื่อคลิกไปค้นหาในตารางคิวงาน เช่น "ยุควิทยายุทธ์เดือด: เซ..." -> "ยุควิทยายุทธ์เดือด: เซ"
                const searchKeyword = displayName.replace(/\.\.\.+$/, '').replace(/…+$/, '').trim();

                const stepKey = getQueueCurrentStep(q);
                let itemClass = 'calendar-item';
                let stepLabel = '';

                if (stepKey === 'translate') {
                    if (isUrgent) {
                        itemClass += ' item-translate-urgent';
                        stepLabel = 'รอแปล (ด่วน)';
                    } else {
                        itemClass += ' item-translate';
                        stepLabel = 'รอแปล (ปกติ)';
                    }
                } else if (stepKey === 'typeset') {
                    const isDoing = String(q.typesetstatus || '').trim() === 'กำลังทำ';
                    if (isDoing) {
                        itemClass += ' item-typeset-doing';
                        stepLabel = 'งานลงคำ (กำลังทำ)';
                    } else {
                        itemClass += ' item-typeset-waiting';
                        stepLabel = 'งานรอลงคำ';
                    }
                } else if (stepKey === 'extract') {
                    itemClass += ' item-extract';
                    stepLabel = 'รอดึงคำ';
                } else {
                    itemClass += ' in-queue';
                    stepLabel = stepKey;
                }

                const div = document.createElement('div');
                div.className = itemClass;
                div.innerText = `${isUrgent ? '🔥 ' : ''}${displayName} #${q.chapter}`;
                div.title = `${fullName} ตอนที่ ${q.chapter} | ${stepLabel}${isUrgent ? ' [งานด่วน]' : ''}`;
                div.onclick = () => { switchView('queue'); searchQueue(searchKeyword); };
                cell.appendChild(div);

                if (q.mangaid != null) renderedMangaIds.add(String(q.mangaid));
            });

            if (queueItemsOnDay.length > MAX_DISPLAY) {
                const moreCount = queueItemsOnDay.length - MAX_DISPLAY;
                const moreDiv = document.createElement('div');
                moreDiv.style.cssText = 'font-size: 0.6rem; color: #94a3b8; text-align: center; margin-top: 2px; cursor: pointer;';
                moreDiv.innerText = `+อีก ${moreCount} รายการ`;
                moreDiv.onclick = () => { switchView('queue'); };
                cell.appendChild(moreDiv);
            }

            // 2. Scheduled (Ghost) -- DISABLED AS PER REQUEST
            /*
            scheduledManga.forEach(m => {
                if (!renderedMangaIds.has(m.mangaid.toString())) {
                    const div = document.createElement('div');
                    div.className = 'calendar-item scheduled';
                    div.innerText = `${m.manganame} `;
                    div.title = `กำหนดปล่อย: ${m.releaseday} `;
                    // Clicking scheduled item could trigger "Manual Add" or filter? Just filter for now.
                    div.onclick = () => { switchView('queue'); searchQueue(m.manganame); };
                    cell.appendChild(div);
                }
            });
            */

            calendarContainer.appendChild(cell);
        }
    }

    function timeSince(date) {
        const seconds = Math.floor((new Date() - date) / 1000);
        let interval = Math.floor(seconds / 31536000);

        if (interval > 1) return interval + " ปีที่แล้ว";
        interval = Math.floor(seconds / 2592000);
        if (interval > 1) return interval + " เดือนที่แล้ว";
        interval = Math.floor(seconds / 86400);
        if (interval > 1) return interval + " วันที่แล้ว";
        if (interval === 1) return "เมื่อวานนี้";
        interval = Math.floor(seconds / 3600);
        if (interval > 1) return interval + " ชั่วโมงที่แล้ว";
        interval = Math.floor(seconds / 60);
        if (interval > 1) return interval + " นาทีที่แล้ว";
        return "เมื่อครู่";
    }

    // CRUD Operations
    function handleMangaSubmit(e) {
        e.preventDefault();

        const id = document.getElementById('newMangaId').value;
        const selectedDays = Array.from(document.querySelectorAll('.release-day-cb:checked')).map(cb => cb.value).join(', ');

        const mangaData = {
            manganame: document.getElementById('newMangaName').value,
            originalname: document.getElementById('newOriginalName').value,
            originalurl: document.getElementById('newOriginalUrl').value,
            slug: document.getElementById('newMangaSlug').value,
            status: document.getElementById('newMangaStatus').value,
            lastchapter: document.getElementById('newLastChapter').value,
            needsextract: document.getElementById('newNeedsExtract').checked,
            releaseday: selectedDays || 'None',
            costperchapter: document.getElementById('newCostPerChapter').value,
            lockedtranslator: document.getElementById('newLockedTranslator').value,
            notifyonadd: document.getElementById('newNotifyOnAdd').checked,
            isurgent: document.getElementById('newIsUrgent').checked
        };

        const btn = e.target.querySelector('button[type="submit"]');
        const originalText = btn.innerText;
        btn.innerText = 'กำลังบันทึก...';
        btn.disabled = true;
        showLoader(true);

        if (id) {
            google.script.run
                .withSuccessHandler(response => {
                    handleResponse(response, btn, originalText);
                })
                .withFailureHandler(err => {
                    showLoader(false);
                    Swal.fire({
                        icon: 'error',
                        title: 'Error',
                        text: err.message,
                        confirmButtonColor: '#4f46e5'
                    });
                    btn.innerText = originalText;
                    btn.disabled = false;
                })
                .updateManga(id, mangaData);
        } else {
            google.script.run
                .withSuccessHandler(response => {
                    handleResponse(response, btn, originalText);
                })
                .withFailureHandler(err => {
                    showLoader(false);
                    Swal.fire({
                        icon: 'error',
                        title: 'Error',
                        text: err.message,
                        confirmButtonColor: '#4f46e5'
                    });
                    btn.innerText = originalText;
                    btn.disabled = false;
                })
                .addManga(mangaData);
        }
    }

    function handleResponse(response, btn, originalText) {
        btn.innerText = originalText;
        btn.disabled = false;
        showLoader(false);

        if (response && response.error) {
            Swal.fire({
                icon: 'error',
                title: 'Error',
                text: response.error,
                confirmButtonColor: '#4f46e5'
            });
        } else {
            const isEdit = document.getElementById('newMangaId').value !== '';

            // Extract updated list and potential new ID (for auto-select)
            const updatedList = response.list || response;
            const newMangaId = response.mangaId;

            closeMangaModal();
            showToast(isEdit ? 'อัปเดตข้อมูลเรียบร้อยแล้ว' : 'เพิ่มมังงะใหม่เรียบร้อยแล้ว');
            onDataLoaded(updatedList);

            if (returnToQueue && !isEdit) {
                // Re-open queue modal if we came from there
                setTimeout(() => {
                    openQueueModal(true); // Keep state

                    // Auto-select the newly added manga
                    if (newMangaId) {
                        const dropdown = document.getElementById('queueMangaId');
                        if (dropdown) dropdown.value = newMangaId;
                    }

                    returnToQueue = false;
                }, 350); // Increased slightly to ensure dropdown is populated
            }
        }
    }

    function editManga(id) {
        if (!id) return;
        const manga = mangaList.find(m => m.mangaid != null && id != null && String(m.mangaid) === String(id));
        if (!manga) return;

        openMangaModal();

        setTimeout(() => {
            if (document.getElementById('newMangaId')) document.getElementById('newMangaId').value = manga.mangaid || '';
            if (document.getElementById('newMangaName')) document.getElementById('newMangaName').value = manga.manganame || '';
            if (document.getElementById('newOriginalName')) document.getElementById('newOriginalName').value = manga.originalname || '';
            if (document.getElementById('newOriginalUrl')) document.getElementById('newOriginalUrl').value = manga.originalurl || '';
            if (document.getElementById('newMangaSlug')) document.getElementById('newMangaSlug').value = manga.slug || '';
            if (document.getElementById('newMangaStatus')) document.getElementById('newMangaStatus').value = manga.status || 'Ongoing';
            if (document.getElementById('newLastChapter')) document.getElementById('newLastChapter').value = manga.lastchapter || '0';
            if (document.getElementById('newNeedsExtract')) {
                document.getElementById('newNeedsExtract').checked = (manga.needsextract === true || manga.needsextract === 'true');
            }
            if (manga.releaseday) {
                const days = manga.releaseday.split(',').map(d => d.trim());
                document.querySelectorAll('.release-day-cb').forEach(cb => {
                    cb.checked = days.includes(cb.value);
                });
            } else {
                document.querySelectorAll('.release-day-cb').forEach(cb => cb.checked = false);
            }
            if (document.getElementById('newCostPerChapter')) document.getElementById('newCostPerChapter').value = manga.costperchapter || 0;
            if (document.getElementById('newLockedTranslator')) {
                document.getElementById('newLockedTranslator').value = manga.lockedtranslator || '';
                if (ssLockedTranslator) ssLockedTranslator.setSelected(manga.lockedtranslator || '');
            }
            if (document.getElementById('newNotifyOnAdd')) {
                document.getElementById('newNotifyOnAdd').checked = (manga.notifyonadd === true || manga.notifyonadd === 'true');
            }
            if (document.getElementById('newIsUrgent')) {
                document.getElementById('newIsUrgent').checked = isUrgentManga(manga);
            }
            if (document.getElementById('newMangaModalTitle')) document.getElementById('newMangaModalTitle').innerText = 'แก้ไขข้อมูลมังงะ';
        }, 300); // Wait for modal to open and settle
    }

    window.toggleSelectAllFiltered = function (checked) {
        if (!currentFilteredQueue || currentFilteredQueue.length === 0) return;
        
        currentFilteredQueue.forEach(q => {
            const qid = q.queueid.toString();
            if (checked) {
                selectedQueueIds.add(qid);
            } else {
                selectedQueueIds.delete(qid);
            }
        });

        // Update DOM checkboxes in the table
        const checkboxes = document.querySelectorAll('.queue-row-checkbox');
        checkboxes.forEach(cb => {
            cb.checked = checked;
            const tr = cb.closest('tr');
            if (tr) {
                if (checked) tr.classList.add('selected-row');
                else tr.classList.remove('selected-row');
            }
        });

        updateBulkActionBar();
    };

    window.handleQueueCheckboxChange = function (queueId, checked) {
        const qidStr = queueId.toString();
        if (checked) {
            selectedQueueIds.add(qidStr);
        } else {
            selectedQueueIds.delete(qidStr);
        }

        const tr = document.getElementById(`row-q-${qidStr}`);
        if (tr) {
            if (checked) tr.classList.add('selected-row');
            else tr.classList.remove('selected-row');
        }

        updateBulkActionBar();

    window.clearQueueSelection = function () {
        selectedQueueIds.clear();
        const checkboxes = document.querySelectorAll('.queue-row-checkbox');
        checkboxes.forEach(cb => {
            cb.checked = false;
            const tr = cb.closest('tr');
            if (tr) tr.classList.remove('selected-row');
        });
        updateBulkActionBar();
    };

    window.updateBulkActionBar = function () {
        const count = selectedQueueIds.size;
        const badge = document.getElementById('selectedCountBadge');
        if (badge) badge.innerText = count;

        const btnClear = document.getElementById('btnClearQueueSelection');
        if (btnClear) {
            btnClear.style.display = count > 0 ? 'inline-flex' : 'none';
        }

        const btnApply = document.getElementById('btnBulkApplyStatus');
        if (btnApply) {
            if (count > 0) {
                btnApply.disabled = false;
                btnApply.style.opacity = '1';
                btnApply.style.cursor = 'pointer';
                btnApply.innerHTML = `<span>⚡ อัปเดตสถานะ (${count} รายการ)</span>`;
            } else {
                btnApply.disabled = true;
                btnApply.style.opacity = '0.6';
                btnApply.style.cursor = 'not-allowed';
                btnApply.innerHTML = `<span>⚡ อัปเดตสถานะทั้งหมด</span>`;
            }
        }

        // Sync header toggle and bar toggle based on visible/filtered items
        const headerToggle = document.getElementById('selectAllQueueHeader');
        const barToggle = document.getElementById('bulkSelectAllToggle');
        const totalVisible = currentFilteredQueue ? currentFilteredQueue.length : 0;

        let visibleSelectedCount = 0;
        if (totalVisible > 0) {
            currentFilteredQueue.forEach(q => {
                if (selectedQueueIds.has(q.queueid.toString())) {
                    visibleSelectedCount++;
                }
            });
        }

        const allVisibleSelected = totalVisible > 0 && visibleSelectedCount === totalVisible;
        const someVisibleSelected = visibleSelectedCount > 0 && visibleSelectedCount < totalVisible;

        if (headerToggle) {
            headerToggle.checked = allVisibleSelected;
            headerToggle.indeterminate = someVisibleSelected;
            headerToggle.disabled = totalVisible === 0;
        }
        if (barToggle) {
            barToggle.checked = allVisibleSelected;
            barToggle.indeterminate = someVisibleSelected;
            barToggle.disabled = totalVisible === 0;
        }

        // Highlight toolbar when items are selected
        const bar = document.getElementById('bulkActionBar');
        if (bar) {
            if (count > 0) {
                bar.style.borderColor = 'var(--primary-color)';
                bar.style.background = 'rgba(99, 102, 241, 0.12)';
            } else {
                bar.style.borderColor = 'var(--border-color)';
                bar.style.background = 'rgba(99, 102, 241, 0.05)';
            }
        }
    };
