<div id="mangaModalNew" class="modal" style="z-index: 20000; display: none;">
    <div class="modal-content">
        <h2 id="newMangaModalTitle" style="margin-bottom: 1.5rem;">เพิ่มมังงะใหม่</h2>
        <form id="newMangaForm" onsubmit="handleMangaSubmit(event)">
            <input type="hidden" id="newMangaId">
            
            <!-- --- CRITICAL SLUG FIELD --- -->
            <div class="form-group" style="background: #fffbeb; padding: 1rem; border-radius: 0.5rem; border: 2px solid #f59e0b; margin-bottom: 1.5rem;">
                <label style="color: #b45309; font-weight: bold; font-size: 1.1rem;">🔗 Manga Slug (ID สำหรับอัปเดตเว็บ)</label>
                <input type="text" id="newMangaSlug" placeholder="เช่น solo-leveling" style="border: 2px solid #fbbf24; font-size: 1rem; padding: 0.75rem;">
                <p style="font-size: 0.8rem; color: #d97706; margin-top: 0.5rem;">⚠️ จำเป็น: ต้องตรงกับ ID บนเว็บเพื่อให้ระบบอัปเดตตอนให้อัตโนมัติ</p>
            </div>

            <div class="form-group">
                <label>ชื่อมังงะ (ภาษาไทย)</label>
                <input type="text" id="newMangaName" placeholder="เช่น วันพีซ" required>
            </div>

            <div class="form-group">
                <label>ชื่อต้นฉบับ (อังกฤษ/ญี่ปุ่น)</label>
                <input type="text" id="newOriginalName" placeholder="เช่น One Piece">
            </div>

            <div class="form-group">
                <label>URL ต้นฉบับ</label>
                <input type="url" id="newOriginalUrl" placeholder="https://...">
            </div>

            <div class="form-row" style="display: flex; gap: 1rem; align-items: flex-end;">
                <div class="form-group" style="flex: 1;">
                    <label>สถานะ</label>
                    <select id="newMangaStatus">
                        <option value="Ongoing">กำลังอ่าน (Ongoing)</option>
                        <option value="Completed">จบแล้ว (Completed)</option>
                        <option value="Drop">ดอง/เลิกอ่าน (Drop)</option>
                    </select>
                </div>
                <div class="form-group" style="flex: 1;">
                    <label>ตอนที่ทำถึง</label>
                    <input type="number" id="newLastChapter" value="0">
                </div>
                <div class="form-group" style="flex: 1;">
                    <label>ต้นทุนต่อตอน (บาท)</label>
                    <input type="number" id="newCostPerChapter" value="0" step="0.01">
                </div>
            </div>

            <div class="form-group">
                <label>ผู้แปลหลัก (Auto-select)</label>
                <select id="newLockedTranslator">
                    <option value="">-- ไม่มีการล็อคคนแปล --</option>
                </select>
            </div>

            <div class="form-group"
                style="display: flex; align-items: center; gap: 0.5rem; background: #f8fafc; padding: 0.75rem; border-radius: 0.5rem; margin-top: 0.5rem;">
                <input type="checkbox" id="newNeedsExtract" checked style="width: auto; margin-bottom: 0;">
                <label for="newNeedsExtract" style="margin-bottom: 0; cursor: pointer;">ต้องดึงคำ (Requires Text
                    Extraction)</label>
            </div>

            <div class="form-group"
                style="display: flex; align-items: center; gap: 0.5rem; background: #fff7ed; padding: 0.75rem; border-radius: 0.5rem; margin-top: 0.5rem; border: 1px solid #ffedd5;">
                <input type="checkbox" id="newNotifyOnAdd" style="width: auto; margin-bottom: 0;">
                <label for="newNotifyOnAdd" style="margin-bottom: 0; cursor: pointer; color: #9a3412; font-weight: 600;">🔔 แจ้งเตือน Telegram เมื่อเพิ่มคิวงาน</label>
            </div>

            <div class="form-group"
                style="display: flex; align-items: center; gap: 0.5rem; background: #fef2f2; padding: 0.75rem; border-radius: 0.5rem; margin-top: 0.5rem; border: 1px solid #fecaca;">
                <input type="checkbox" id="newIsUrgent" style="width: auto; margin-bottom: 0;">
                <label for="newIsUrgent" style="margin-bottom: 0; cursor: pointer; color: #b91c1c; font-weight: 600;">🔥 งานด่วน (Urgent) — แสดงชื่อเรื่องเป็นสีแดงในหน้าจัดการคิวงาน</label>
            </div>

            <div class="form-group">
                <label>วันปล่อยดิบ (Release Day)</label>
                <div id="releaseDaysContainer"
                    style="display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 0.5rem; background: #f8fafc; padding: 0.75rem; border-radius: 0.5rem;">
                    <label
                        style="display: flex; align-items: center; gap: 0.4rem; font-weight: normal; cursor: pointer; margin-bottom: 0;">
                        <input type="checkbox" class="release-day-cb" value="วันจันทร์"
                            style="width: auto; margin-bottom: 0;"> จันทร์
                    </label>
                    <label
                        style="display: flex; align-items: center; gap: 0.4rem; font-weight: normal; cursor: pointer; margin-bottom: 0;">
                        <input type="checkbox" class="release-day-cb" value="วันอังคาร"
                            style="width: auto; margin-bottom: 0;"> อังคาร
                    </label>
                    <label
                        style="display: flex; align-items: center; gap: 0.4rem; font-weight: normal; cursor: pointer; margin-bottom: 0;">
                        <input type="checkbox" class="release-day-cb" value="วันพุธ"
                            style="width: auto; margin-bottom: 0;"> พุธ
                    </label>
                    <label
                        style="display: flex; align-items: center; gap: 0.4rem; font-weight: normal; cursor: pointer; margin-bottom: 0;">
                        <input type="checkbox" class="release-day-cb" value="วันพฤหัสบดี"
                            style="width: auto; margin-bottom: 0;"> พฤหัสฯ
                    </label>
                    <label
                        style="display: flex; align-items: center; gap: 0.4rem; font-weight: normal; cursor: pointer; margin-bottom: 0;">
                        <input type="checkbox" class="release-day-cb" value="วันศุกร์"
                            style="width: auto; margin-bottom: 0;"> ศุกร์
                    </label>
                    <label
                        style="display: flex; align-items: center; gap: 0.4rem; font-weight: normal; cursor: pointer; margin-bottom: 0;">
                        <input type="checkbox" class="release-day-cb" value="วันเสาร์"
                            style="width: auto; margin-bottom: 0;"> เสาร์
                    </label>
                    <label
                        style="display: flex; align-items: center; gap: 0.4rem; font-weight: normal; cursor: pointer; margin-bottom: 0;">
                        <input type="checkbox" class="release-day-cb" value="วันอาทิตย์"
                            style="width: auto; margin-bottom: 0;"> อาทิตย์
                    </label>
                </div>
            </div>

            <div style="display: flex; gap: 1rem; margin-top: 1.5rem;">
                <button type="button" class="btn" style="background: #e2e8f0; flex: 1;"
                    onclick="closeMangaModal()">ยกเลิก</button>
                <button type="submit" class="btn btn-primary" style="flex: 2;">บันทึกข้อมูล</button>
            </div>
        </form>
    </div>
</div>
